# Bridge production hardening override
# Kullanım:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Bu dosya ana docker-compose.yml üzerine uygulanır ve production güvenlik
# sertleştirmelerini açar. Geliştirme ortamında varsayılan compose dosyasını
# tek başına kullanmak daha rahattır.

services:
  bridge:
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /app/data:size=64m,mode=0750
    environment:
      NODE_ENV: production
      # Production'da metrics endpoint'i yalnızca Bearer token ile açılsın.
      METRICS_SECRET: "${METRICS_SECRET:?METRICS_SECRET zorunlu - openssl rand -hex 32}"
      FEDERATION_SECRET: "${FEDERATION_SECRET:?FEDERATION_SECRET zorunlu - openssl rand -hex 32}"
      AP_ENCRYPTION_KEY: "${AP_ENCRYPTION_KEY:?AP_ENCRYPTION_KEY zorunlu - 64 hex karakter}"
      # Final21 Faz 19 — F21-10-04: Redis parolasız çalışmaz (docs/REDIS_PRODUCTION.md `requirepass`).
      REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD zorunlu - openssl rand -hex 32}@redis:6379"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health/ready || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  postgres:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Final21 Faz 10 — F21-10-03: maxmemory-policy MUTLAKA noeviction.
  # Redis hiz siniri / CSRF / WS baglanti limiti icin YETKILI depodur.
  # allkeys-lru ile OLCULDU (redis:8-alpine, maxmemory 4mb): arama siniri
  # doldu (429), bellek baskisi 31 807 anahtar tahliye etti, iki hiz siniri
  # anahtari da silindi ve AYNI DAKIKADA 5/5 arama 200 dondu — sinir ASILDI.
  # noeviction ile ayni adimlar: yazmalar reddedildi, anahtarlar kaldi, 5/5 429.
  # Bellek dolarsa Bridge fail-closed 503 verir (docs/REDIS_PRODUCTION.md).
  #
  # Final21 Faz 19 — F21-10-04: KİMLİK DOĞRULAMASIZ REDIS YOK. Üretim rehberi `requirepass`
  # ister ("Never expose an unauthenticated Redis"); bu dosya ayarlamıyordu. Parola `.env`ten
  # gelir (yoksa `docker compose up` DURUR) ve yapılandırma STDIN ile verilir: argüman olsaydı
  # `ps`/`docker top` ile okunurdu. Sağlık denetimi kimlik doğrulayarak PONG bekler.
  #
  # `user: 999:1000` (imajın `redis` kullanıcısı): bu dosyanın önceki hâli de ÇALIŞMIYORDU.
  # `cap_drop: ALL` ile imajın giriş betiği `redis` kullanıcısına geçemiyor, Redis yeteneksiz
  # root olarak kalıyor ve `redis`e ait `/data`ya yazamıyordu: "Can't open or create append-only
  # dir: Permission denied", sürekli yeniden başlatma (ölçüldü, tools/p19-compose-redis-proof.sh).
  # Doğrudan `redis` kullanıcısıyla çalışınca hiçbir yetenek gerekmez.
  redis:
    user: "999:1000"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD zorunlu - openssl rand -hex 32}"
    command:
      - sh
      - -c
      - |
        exec redis-server - --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction --save 60 1000 <<EOF
        requirepass $$REDIS_PASSWORD
        EOF
    healthcheck:
      # `$$`: Compose yorumlamaz, kapsayıcıdaki kabuk açar (parola oluşturulan yapılandırmaya yazılmaz).
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  backup:
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
    tmpfs:
      - /tmp:size=64m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  nginx:
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx:size=64m
      - /var/run:size=16m
      - /tmp:size=64m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
