name: Desktop WebRTC audio A/B on Electron (synthetic, not Bridge parity)

on:
  pull_request:
    paths:
      - 'bench-ui/audio-*'
      - '.github/workflows/desktop-audio-ab-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-electron-audio-ab:
    name: Real Electron WebRTC audio + 10k UI / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install locked benchmark, Electron and app build dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix electron --no-audit --no-fund
          npm ci --prefix bench-ui --no-audit --no-fund
      - name: Prepare pinned real Electron binaries
        run: node electron/node_modules/electron/install.js
      - name: Install Linux Xvfb for real Electron renderer
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth
      - name: Build both identical UI fixtures and verify fail-closed evidence
        run: |
          node bench-ui/build-assets.mjs
          node --test bench-ui/*.test.cjs
      - name: Measure true local WebRTC RTP audio under identical framework load
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a electron/node_modules/electron/dist/electron --no-sandbox bench-ui/audio-electron-benchmark.cjs 2>&1 | tee bench-audio.log
          else
            node electron/node_modules/electron/cli.js --no-sandbox bench-ui/audio-electron-benchmark.cjs 2>&1 | tee bench-audio.log
          fi
          node bench-ui/audio-report.cjs
      - name: Preserve first-attempt audio evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-audio-ab-${{ matrix.os }}-${{ github.sha }}
          path: |
            bench-ui/generated/audio-report.json
            bench-audio.log
          if-no-files-found: warn
          retention-days: 14
