name: Bridge 3D Social Space authority (supplemental)

# An isolated additional proof lane, NOT a substitute for Quality Gate or real
# PostgreSQL/Redis cluster, mobile, security, or end-to-end acceptance.
on:
  pull_request:
    branches:
      - main
      - codex/activities-3d-social-room-foundation-20261030
    paths:
      - 'server/socket/handlers/social-room*.ts'
      - 'server/socket/index.ts'
      - 'server/tests/social-room-authority.test.ts'
      - '.github/workflows/bridge-social-space-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  social-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci --no-audit --no-fund
          cd server && npm ci --no-audit --no-fund
      - name: Strict server and test types
        run: |
          npm run typecheck:server
          cd server && npm run typecheck:test-strict
      - name: Real social-room handler contract tests, zero skipped
        working-directory: server
        run: |
          node node_modules/jest/bin/jest.js --runInBand --runTestsByPath tests/social-room-authority.test.ts --json --outputFile=social-room-evidence.json
          node - <<'NODE'
          const fs = require('node:fs');
          const r = JSON.parse(fs.readFileSync('social-room-evidence.json', 'utf8'));
          if (!Number.isSafeInteger(r.numTotalTests) || r.numTotalTests < 10 ||
              r.numFailedTests !== 0 || r.numPendingTests !== 0 ||
              r.numPassedTests !== r.numTotalTests) {
            console.error('SOCIAL_3D_AUTHORITY_TESTS_UNQUALIFIED');
            process.exit(1);
          }
          console.log('SOCIAL_3D_AUTHORITY_TESTS:' + r.numPassedTests + '/' + r.numTotalTests + ':0_skipped');
          NODE
      - name: Server build
        run: cd server && npm run build
      - name: Preserve exact-head first attempt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-room-authority-proof
          path: server/social-room-evidence.json
          if-no-files-found: warn
