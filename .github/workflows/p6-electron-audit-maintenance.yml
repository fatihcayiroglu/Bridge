name: P6 Electron Audit Maintenance

on:
  push:
    branches: [gpt/p6-closure]
    paths:
      - .github/workflows/p6-electron-audit-maintenance.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'fatihcayiroglu/Bridge'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gpt/p6-closure
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Repair Electron transitive advisory without force
        shell: bash
        run: |
          set -euo pipefail
          cd electron
          npm ls http-cache-semantics || true
          cp package.json "$RUNNER_TEMP/electron-package.json.before"
          npm audit fix --package-lock-only --ignore-scripts --no-fund
          cmp package.json "$RUNNER_TEMP/electron-package.json.before"
          npm audit --audit-level=high
          npm ci --ignore-scripts --no-audit --no-fund
          npm run compile
          cd ..
          git diff --check
          test -z "$(git diff --name-only -- electron/package.json)"
          test "$(git diff --name-only -- electron/package-lock.json | wc -l)" -eq 1

      - name: Commit generated Electron lock repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/p6-electron-audit-maintenance.yml
          git config user.name 'Bridge CI Maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add electron/package-lock.json .github/workflows/p6-electron-audit-maintenance.yml
          git commit -m 'fix(electron): refresh audited transitive dependency graph'
          git push origin HEAD:gpt/p6-closure
