name: P6 one-shot lifecycle contract refresh

on:
  push:
    branches: [p6/closure-openai]
    paths:
      - .github/workflows/p6-lifecycle-contract-refresh.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: p6/closure-openai
      - name: Align tombstone read paths and legacy tests
        run: python3 -c "import base64;exec(base64.b64decode(''))"
      - name: Commit
        run: |
          git config user.name "bridge-ci"
          git config user.email "bridge-ci@users.noreply.github.com"
          git add server/routes/federation/social.ts scripts/federation-lab/run.mjs server/tests/federation-inbox-handler-shapes.test.ts
          git commit -m "fix(federation): hide tombstones and align lifecycle evidence"
          git push origin HEAD:p6/closure-openai
