name: Desktop Linux + macOS native gates

# Non-publishing PR/branch verification, independent of release signing.
# Installed desktop clients connect to a Bridge server; no server is bundled.
on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'electron/**'
      - '.github/workflows/desktop-native-gates.yml'
  push:
    branches: [main]
    paths:
      - 'electron/**'
      - '.github/workflows/desktop-native-gates.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  linux:
    name: Linux x64 — real Electron window + AppImage/DEB
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Install exact Electron dependencies
        run: cd electron && npm ci --no-audit --no-fund
      - name: Linux Electron contract suite (no unconditional skip)
        run: cd electron && npm test -- --runInBand --ci
      - name: Compile packaged Electron source
        run: cd electron && npm run compile
      - name: Build Linux x64 AppImage and DEB without publishing
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --linux AppImage deb --x64 --publish never
      - name: Assert Linux packages and unpacked runtime
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          appimages=(electron/release/*.AppImage)
          debs=(electron/release/*.deb)
          test "${#appimages[@]}" -ge 1 || { echo "No AppImage output" >&2; exit 1; }
          test "${#debs[@]}" -ge 1 || { echo "No DEB output" >&2; exit 1; }
          test -x electron/release/linux-unpacked/bridge
          test -s electron/release/linux-unpacked/resources/app.asar
          for deb in "${debs[@]}"; do
            dpkg-deb --info "${deb}" >/dev/null
            # Never combine dpkg-deb's large output with grep -q under
            # pipefail: grep exits on the first match, SIGPIPE kills the
            # producer, and a valid package is reported as a false failure.
            listing="$(mktemp)"
            dpkg-deb --contents "${deb}" > "${listing}"
            if ! grep -Fq 'usr/share/applications/bridge.desktop' "${listing}"; then
              echo "DEB missing expected desktop entry: ${deb}" >&2
              rm -f "${listing}"
              exit 1
            fi
            rm -f "${listing}"
          done
          file electron/release/linux-unpacked/bridge
      - name: Install built DEB and headless display dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xdotool dbus-x11
          shopt -s nullglob
          debs=(electron/release/*.deb)
          test "${#debs[@]}" -eq 1 || { echo "Expected one DEB to install" >&2; exit 1; }
          sudo apt-get install -y --no-install-recommends "$(realpath "${debs[0]}")"
          # A real DEB install runs postinst to configure Chromium's Linux
          # sandbox. Do not bypass it with --no-sandbox or run as root.
          test -x /opt/Bridge/bridge
          test "$(stat -c %u /opt/Bridge/chrome-sandbox)" = 0
          ls -l /opt/Bridge/chrome-sandbox
      - name: Installed Linux first-run window smoke (real X11, OS sandbox)
        run: xvfb-run -a -- dbus-run-session -- bash electron/scripts/ci-linux-window-smoke.sh
      - name: Preserve Linux package artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: bridge-linux-x64-pr-unsigned
          path: |
            electron/release/*.AppImage
            electron/release/*.deb
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS x64 + arm64 — unsigned DMG/ZIP package contracts
    runs-on: macos-14
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Install exact Electron dependencies
        run: cd electron && npm ci --no-audit --no-fund
      - name: macOS Electron contract suite (real macOS runner)
        run: cd electron && npm test -- --runInBand --ci
      - name: Compile packaged Electron source
        run: cd electron && npm run compile
      # PRs cannot require the production Apple certificate or notarization
      # secrets. These unsigned binaries are CI artifacts, NOT a public release.
      - name: Build macOS x64 and arm64 unsigned DMG/ZIP (no publishing)
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dmg zip --x64 --arm64 --publish never -c.mac.identity=null -c.mac.notarize=false
      - name: Assert both architecture bundles and installer images
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(electron/release/*.dmg)
          zips=(electron/release/*.zip)
          test "${#dmgs[@]}" -ge 2 || { echo "Expected macOS x64 + arm64 DMGs" >&2; exit 1; }
          test "${#zips[@]}" -ge 2 || { echo "Expected macOS x64 + arm64 ZIPs" >&2; exit 1; }
          for arch in mac mac-arm64; do
            app="electron/release/${arch}/Bridge.app"
            test -s "${app}/Contents/Resources/app.asar"
            test -x "${app}/Contents/MacOS/Bridge"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${app}/Contents/Info.plist")" = 'com.bridge.desktop'
            file "${app}/Contents/MacOS/Bridge"
          done
          file electron/release/mac/Bridge.app/Contents/MacOS/Bridge | grep -q x86_64
          file electron/release/mac-arm64/Bridge.app/Contents/MacOS/Bridge | grep -q arm64
          for image in "${dmgs[@]}"; do hdiutil imageinfo "${image}" >/dev/null; done
          for archive in "${zips[@]}"; do unzip -tq "${archive}" >/dev/null; done
      # Launch the matching native packaged app from the same build. A DMG/ZIP
      # checksum alone does not prove the app can bootstrap its real UI.
      # CI-only loopback DevTools confirms connect.html loaded, not visible
      # desktop window or signing/notarization.
      - name: Packaged macOS native first-run renderer smoke
        shell: bash
        run: node electron/scripts/ci-macos-first-run.mjs
      - name: Preserve macOS package artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: bridge-macos-x64-arm64-pr-unsigned
          path: |
            electron/release/*.dmg
            electron/release/*.zip
          if-no-files-found: error
          retention-days: 7
