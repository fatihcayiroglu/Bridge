name: Native pilot real PostgreSQL16 Redis integration

on:
  pull_request:
    paths:
      - 'mobile-native-pilot/**'
      - 'server/**'
      - 'e2e/native-auth/**'
      - 'e2e/playwright.native-auth.config.mjs'
      - '.github/workflows/native-pilot-backend-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: development
      HOST: 127.0.0.1
      PORT: '3001'
      BASE_URL: https://127.0.0.1:8443
      ALLOWED_ORIGINS: https://127.0.0.1:8443
      BRIDGE_IT_ORIGIN: https://127.0.0.1:8443
      NATIVE_AUTH_REDIRECT_URIS: com.bridge.nativepilot:/oauth
      BRIDGE_IT_REDIRECT: com.bridge.nativepilot:/oauth
      BRIDGE_IT_PROXY_EVIDENCE: ${{ github.workspace }}/integration-evidence/proxy.log
      DATABASE_URL: postgresql://bridge_it:disposable_ci_only@127.0.0.1:5432/bridge_native_it
      REDIS_URL: redis://127.0.0.1:6379/0
      # Only test-volume quotas change; PKCE, cookie, CSRF, JWT, 2FA and reuse
      # validation remain the real implementation, NODE_ENV is never test.
      MAX_REG_PER_HOUR: '1000'
      RL_REGISTER_MAX: '1000'
      RL_LOGIN_MAX: '1000'
      RL_REFRESH_MAX: '1000'
      RL_2FA_MAX: '1000'
      FEDERATION_ENABLED: 'false'
      AI_PROVIDER: none
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bridge_it
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: bridge_native_it
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bridge_it -d bridge_native_it"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Verify isolated assembly and real service identities
        run: |
          mkdir -p integration-evidence
          git rev-parse HEAD > integration-evidence/head.txt
          git merge-base --is-ancestor e7de5d5c957d6d36691de1b501825df6e17599a2 HEAD
          git merge-base --is-ancestor 51c95a75ae232912806d1208c178eae8c8d61228 HEAD
          docker exec '${{ job.services.postgres.id }}' psql -U bridge_it -d bridge_native_it -Atc 'SHOW server_version_num' | tee integration-evidence/postgres-version.txt
          grep -Eq '^16[0-9]{4}$' integration-evidence/postgres-version.txt
          docker exec '${{ job.services.redis.id }}' redis-cli ping | tee integration-evidence/redis-ping.txt
          grep -qx PONG integration-evidence/redis-ping.txt
      - name: Install exact lockfiles and audit without suppressions
        run: |
          npm ci --no-fund
          npm ci --prefix server --no-fund
          npm ci --prefix mobile-native-pilot --no-fund
          npm ci --prefix e2e --no-fund
          npm audit --audit-level=high
          npm audit --prefix server --audit-level=high
          npm audit --prefix mobile-native-pilot --audit-level=low
          npm audit --prefix e2e --audit-level=low
      - name: Build actual backend and browser client
        run: |
          npm run build --prefix server
          npm run build
      - name: Refresh-cookie security regression contracts
        working-directory: server
        env:
          # These are explicitly in-memory handler contracts, not the real
          # backend process below. Do not inherit its configured Redis authority
          # into Jest without opening a connection. Real integration retains
          # the job's REDIS_URL and all production fail-closed checks.
          REDIS_URL: ''
        run: |
          npx jest --runInBand --ci --runTestsByPath tests/auth-cookies.test.ts tests/app-integration.test.ts tests/native-browser-switch.test.ts tests/native-switch-store.test.ts tests/native-auth.test.ts tests/twoFactor.test.ts tests/twofactor-check-races.test.ts tests/twofactor-rate-limit.test.ts tests/twofactor-challenge-fail-closed.test.ts --json --outputFile ../integration-evidence/server-cookie-contracts.json
          node -e 'const r=require("../integration-evidence/server-cookie-contracts.json");if(!r.success || !r.numTotalTests || r.numPassedTests!==r.numTotalTests || r.numFailedTests || r.numPendingTests || r.numTodoTests)throw Error("SERVER_CONTRACTS_INCOMPLETE");console.log(JSON.stringify({tests:r.numTotalTests,pass:r.numPassedTests,failed:r.numFailedTests,skipped:r.numPendingTests,todo:r.numTodoTests}))'
      - name: Install real Chromium and certificate management tools
        run: |
          (cd e2e && npx playwright install --with-deps chromium)
          sudo apt-get install -y --no-install-recommends libnss3-tools
      - name: Permit sandbox user namespaces for the exact test Chromium binary
        run: |
          # First run: Ubuntu AppArmor denied the browser's namespace sandbox.
          # Keep the global restriction and Chromium sandbox enabled; allow
          # only the installed test executable, without wildcard attachments.
          task_chromium=$(cd e2e && node --input-type=module -e 'import {chromium} from "@playwright/test"; console.log(chromium.executablePath())')
          test -x "$task_chromium"
          [[ "$task_chromium" =~ ^[A-Za-z0-9_./-]+$ ]]
          task_userns_before=$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile bridge-ci-chromium "%s" flags=(unconfined) {\n  userns,\n}\n' "$task_chromium" > "$RUNNER_TEMP/bridge-ci-chromium.apparmor"
          sudo install -o root -g root -m 0644 "$RUNNER_TEMP/bridge-ci-chromium.apparmor" /etc/apparmor.d/bridge-ci-chromium
          sudo apparmor_parser -r /etc/apparmor.d/bridge-ci-chromium
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = "$task_userns_before"
          echo 'CHROMIUM_SANDBOX_EXACT_BINARY_ALLOWLIST_READY'
      - name: Create ephemeral secrets and a trusted local TLS certificate
        shell: bash
        run: |
          umask 077
          for key in JWT_SECRET REFRESH_SECRET; do
            value=$(openssl rand -hex 64)
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=Bridge disposable integration CA' -keyout "$RUNNER_TEMP/it-ca.key" -out "$RUNNER_TEMP/it-ca.crt" 2>/dev/null
          openssl req -newkey rsa:2048 -nodes -subj '/CN=127.0.0.1' -keyout "$RUNNER_TEMP/it-server.key" -out "$RUNNER_TEMP/it-server.csr" 2>/dev/null
          printf 'subjectAltName=IP:127.0.0.1\nextendedKeyUsage=serverAuth\n' > "$RUNNER_TEMP/it-ext.cnf"
          openssl x509 -req -in "$RUNNER_TEMP/it-server.csr" -CA "$RUNNER_TEMP/it-ca.crt" -CAkey "$RUNNER_TEMP/it-ca.key" -CAcreateserial -days 1 -extfile "$RUNNER_TEMP/it-ext.cnf" -out "$RUNNER_TEMP/it-server.crt" 2>/dev/null
          echo "NODE_EXTRA_CA_CERTS=$RUNNER_TEMP/it-ca.crt" >> "$GITHUB_ENV"
          echo "IT_TLS_KEY=$RUNNER_TEMP/it-server.key" >> "$GITHUB_ENV"
          echo "IT_TLS_CERT=$RUNNER_TEMP/it-server.crt" >> "$GITHUB_ENV"
          value=$(openssl rand -hex 24)
          echo "::add-mask::$value"
          echo "BRIDGE_BROWSER_IT_PASSWORD=$value" >> "$GITHUB_ENV"
          # A separate UNTRUSTED server is a real TLS refusal control. It is
          # never imported into the trust store and never receives credentials.
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=Bridge untrusted TLS control' -addext 'subjectAltName=IP:127.0.0.1' -keyout "$RUNNER_TEMP/it-untrusted.key" -out "$RUNNER_TEMP/it-untrusted.crt" 2>/dev/null
          echo "IT_UNTRUSTED_KEY=$RUNNER_TEMP/it-untrusted.key" >> "$GITHUB_ENV"
          echo "IT_UNTRUSTED_CERT=$RUNNER_TEMP/it-untrusted.crt" >> "$GITHUB_ENV"
      - name: Trust only the per-run CA in a new disposable-runner NSS database
        run: |
          # Chromium M146+ default. Never replace an existing trust database.
          test ! -e "$HOME/.pki/nssdb"
          task_ca_db="$HOME/.local/share/pki/nssdb"
          test ! -e "$task_ca_db"
          mkdir -p "$task_ca_db"
          certutil -N --empty-password -d "sql:$task_ca_db"
          certutil -A -d "sql:$task_ca_db" -n 'Bridge disposable integration CA' -t 'C,,' -i "$NODE_EXTRA_CA_CERTS"
          certutil -L -d "sql:$task_ca_db"
      - name: Initialize only disposable database and start real HTTPS backend
        run: |
          node server/dist/db/postgres/index.js > integration-evidence/schema.log 2>&1
          (cd server && node dist/index.js) > integration-evidence/server.log 2>&1 &
          echo $! > "$RUNNER_TEMP/bridge-it.pid"
          node mobile-native-pilot/scripts/integration-https-proxy.mjs > integration-evidence/proxy.log 2>&1 &
          echo $! > "$RUNNER_TEMP/bridge-proxy.pid"
          for i in $(seq 1 60); do
            if curl --cacert "$NODE_EXTRA_CA_CERTS" -fsS "$BRIDGE_IT_ORIGIN/api/health" > integration-evidence/health.json 2>/dev/null; then break; fi
            sleep 1
          done
          curl --cacert "$NODE_EXTRA_CA_CERTS" -fsS "$BRIDGE_IT_ORIGIN/api/health" > integration-evidence/health.json
      - name: Real PKCE session and outbox replay integration (no retries)
        run: |
          set -o pipefail
          node --test --test-reporter=tap --test-timeout=180000 mobile-native-pilot/integration/native-auth-backend.it.mjs 2>&1 | tee integration-evidence/native-backend.tap
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            import {classifyNodeRun} from "./mobile-native-pilot/scripts/mutation-result.mjs";
            const result=classifyNodeRun({stdout:readFileSync("integration-evidence/native-backend.tap","utf8"),status:0});
            if(result.outcome!=="SURVIVED" || result.counts.tests!==19) throw Error(JSON.stringify(result));
            console.log(JSON.stringify(result.counts));'
      - name: Independent database persisted-row and scoped-uniqueness proof
        run: |
          docker exec '${{ job.services.postgres.id }}' psql -U bridge_it -d bridge_native_it -Atc "SELECT count(*) FROM messages WHERE content LIKE 'lost-ack-%'" | tee integration-evidence/lost-ack-db-count.txt
          grep -qx 1 integration-evidence/lost-ack-db-count.txt
          docker exec '${{ job.services.postgres.id }}' psql -U bridge_it -d bridge_native_it -Atc 'SELECT count(*) FROM (SELECT "userId", "ackId" FROM messages WHERE "ackId" IS NOT NULL GROUP BY "userId", "ackId" HAVING count(*) > 1) AS duplicates' | tee integration-evidence/duplicate-db-count.txt
          grep -qx 0 integration-evidence/duplicate-db-count.txt
      - name: Actual browser login and consent with strict TLS (zero retries)
        working-directory: e2e
        run: |
          set -o pipefail
          npx playwright test --config playwright.native-auth.config.mjs --retries=0 2>&1 | tee ../integration-evidence/browser-ui.log
      - name: Require every browser case, with no skipped or flaky results
        run: |
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const report=JSON.parse(readFileSync("integration-evidence/browser-results.json","utf8"));
            const s=report.stats;
            if(!s || s.expected!==3 || s.unexpected!==0 || s.skipped!==0 || s.flaky!==0 || report.errors?.length) throw Error("BROWSER_ACCEPTANCE_INCOMPLETE");
            console.log(JSON.stringify({tests:3,pass:s.expected,failed:s.unexpected,skipped:s.skipped,flaky:s.flaky}));'
      - name: Stop owned processes
        if: always()
        run: |
          for file in "$RUNNER_TEMP/bridge-it.pid" "$RUNNER_TEMP/bridge-proxy.pid"; do
            if test -f "$file"; then kill "$(cat "$file")" 2>/dev/null || true; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-backend-first-attempt-${{ github.run_id }}-${{ github.run_attempt }}
          path: integration-evidence/
          retention-days: 7
          if-no-files-found: error
