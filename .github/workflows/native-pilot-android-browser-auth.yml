name: Native Android Custom Tabs PKCE acceptance
on:
  pull_request:
    paths: ['mobile-native-pilot/**', 'server/**', '.github/workflows/native-pilot-android-browser-auth.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-custom-tabs:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NODE_ENV: development
      HOST: 127.0.0.1
      PORT: '3001'
      BASE_URL: https://127.0.0.1:8443
      ALLOWED_ORIGINS: https://127.0.0.1:8443
      BRIDGE_IT_ORIGIN: https://127.0.0.1:8443
      NATIVE_AUTH_REDIRECT_URIS: com.bridge.nativepilot:/oauth
      EXPO_PUBLIC_BRIDGE_ORIGIN: https://127.0.0.1:8443
      EXPO_PUBLIC_NATIVE_SELF_TEST: '0'
      CI: '1'
      NODE_OPTIONS: --dns-result-order=ipv4first
      DATABASE_URL: postgresql://bridge_mobile:disposable_ci_only@127.0.0.1:5432/bridge_android_native
      REDIS_URL: redis://127.0.0.1:6379/0
      MAX_REG_PER_HOUR: '1000'
      RL_REGISTER_MAX: '1000'
      RL_LOGIN_MAX: '1000'
      RL_REFRESH_MAX: '1000'
      FEDERATION_ENABLED: 'false'
      AI_PROVIDER: none
      MOBILE_AUTH_EVIDENCE: ${{ github.workspace }}/android-auth-evidence
      BRIDGE_IT_PROXY_EVIDENCE: ${{ github.workspace }}/android-auth-evidence/proxy.log
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bridge_mobile
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: bridge_android_native
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U bridge_mobile -d bridge_android_native" --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Exact dependencies and evidence identity
        run: |
          mkdir -p android-auth-evidence
          git rev-parse HEAD > android-auth-evidence/head.txt
          node --input-type=module -e 'import fs from "node:fs";fs.writeFileSync("android-auth-evidence/android-browser-auth.json",JSON.stringify({status:"NOT EXECUTED",stage:"prerequisites",cases:[],notExecuted:["ANDROID_SYSTEM_BROWSER_CANCEL","ANDROID_AUTHENTICATE_RESTART_ROTATE","ANDROID_SWITCH_ISOLATE_REVOKE_RESTART"],skipped:0},null,2))'
          node --test mobile-native-pilot/tests/android-auth-ui.test.mjs
          npm ci --no-fund
          npm ci --prefix server --no-fund
          npm ci --prefix mobile-native-pilot --no-fund
          npm audit --audit-level=high
          npm audit --prefix server --audit-level=high
          npm audit --prefix mobile-native-pilot --audit-level=low
      - name: Fresh-service identity and ephemeral TLS
        run: |
          docker exec '${{ job.services.postgres.id }}' psql -U bridge_mobile -d bridge_android_native -Atc 'SHOW server_version_num' > android-auth-evidence/postgres-version.txt
          grep -Eq '^16[0-9]{4}$' android-auth-evidence/postgres-version.txt
          docker exec '${{ job.services.redis.id }}' redis-cli ping > android-auth-evidence/redis-ping.txt
          grep -qx PONG android-auth-evidence/redis-ping.txt
          umask 077
          for key in JWT_SECRET REFRESH_SECRET BRIDGE_MOBILE_PASSWORD; do value=$(openssl rand -hex 24); echo "::add-mask::$value"; echo "$key=$value" >> "$GITHUB_ENV"; done
          pin=$(node -e 'console.log(require("crypto").randomInt(100000,1000000))')
          echo "::add-mask::$pin"
          echo "BRIDGE_EMULATOR_PIN=$pin" >> "$GITHUB_ENV"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=Bridge mobile disposable CA' -keyout "$RUNNER_TEMP/android-ca.key" -out "$RUNNER_TEMP/android-ca.crt" 2>/dev/null
          openssl req -newkey rsa:2048 -nodes -subj '/CN=127.0.0.1' -keyout "$RUNNER_TEMP/android-server.key" -out "$RUNNER_TEMP/android-server.csr" 2>/dev/null
          printf 'subjectAltName=IP:127.0.0.1\nextendedKeyUsage=serverAuth\n' > "$RUNNER_TEMP/android-ext.cnf"
          openssl x509 -req -in "$RUNNER_TEMP/android-server.csr" -CA "$RUNNER_TEMP/android-ca.crt" -CAkey "$RUNNER_TEMP/android-ca.key" -CAcreateserial -days 1 -extfile "$RUNNER_TEMP/android-ext.cnf" -out "$RUNNER_TEMP/android-server.crt" 2>/dev/null
          echo "NODE_EXTRA_CA_CERTS=$RUNNER_TEMP/android-ca.crt" >> "$GITHUB_ENV"
          echo "IT_TLS_KEY=$RUNNER_TEMP/android-server.key" >> "$GITHUB_ENV"
          echo "IT_TLS_CERT=$RUNNER_TEMP/android-server.crt" >> "$GITHUB_ENV"
      - name: Real backend and normal-screen APK with scoped debug CA
        run: |
          set -o pipefail
          npm run build --prefix server
          npm run build
          node server/dist/db/postgres/index.js > android-auth-evidence/schema.log 2>&1
          (cd server && node dist/index.js) > "$RUNNER_TEMP/android-auth-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/android-auth-server.pid"
          node mobile-native-pilot/scripts/integration-https-proxy.mjs > android-auth-evidence/proxy.log 2>&1 &
          echo $! > "$RUNNER_TEMP/android-auth-proxy.pid"
          for i in $(seq 1 60); do curl --cacert "$NODE_EXTRA_CA_CERTS" -fsS "$BRIDGE_IT_ORIGIN/api/health" > android-auth-evidence/health.json && break; sleep 1; done
          curl --cacert "$NODE_EXTRA_CA_CERTS" -fsS "$BRIDGE_IT_ORIGIN/api/health" > android-auth-evidence/health.json
          cd mobile-native-pilot
          npx expo prebuild --platform android --no-install
          # Generated DEBUG source only; release manifests/trust remain unchanged.
          mkdir -p android/app/src/debug/res/raw android/app/src/debug/res/xml
          cp "$NODE_EXTRA_CA_CERTS" android/app/src/debug/res/raw/bridge_ci_ca.crt
          printf '%s\n' '<network-security-config><domain-config cleartextTrafficPermitted="true"><domain>127.0.0.1</domain><trust-anchors><certificates src="system"/><certificates src="@raw/bridge_ci_ca"/></trust-anchors></domain-config></network-security-config>' > android/app/src/debug/res/xml/bridge_ci_tls.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as E
          E.register_namespace('android','http://schemas.android.com/apk/res/android')
          E.register_namespace('tools','http://schemas.android.com/tools')
          p='android/app/src/debug/AndroidManifest.xml'
          t=E.parse(p)
          t.getroot().find('application').set('{http://schemas.android.com/apk/res/android}networkSecurityConfig','@xml/bridge_ci_tls')
          t.write(p,encoding='utf-8',xml_declaration=True)
          PY
          (cd android && ./gradlew :app:assembleDebug -PreactNativeArchitectures=x86_64 --no-daemon --max-workers=2) 2>&1 | tee ../android-auth-evidence/apk-build.log
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk > ../android-auth-evidence/apk-sha256.txt
      - name: Enable runner KVM
        run: sudo chmod 666 /dev/kvm
      - name: Genuine Custom Tabs and native Keystore journey (no retries)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash mobile-native-pilot/scripts/android-browser-auth.sh
      - name: Stop only owned backend processes
        if: always()
        run: |
          for file in "$RUNNER_TEMP/android-auth-server.pid" "$RUNNER_TEMP/android-auth-proxy.pid"; do if test -f "$file"; then kill "$(cat "$file")" 2>/dev/null || true; fi; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-custom-tabs-${{ github.run_id }}-${{ github.run_attempt }}
          path: android-auth-evidence/
          if-no-files-found: error
          retention-days: 7
