name: Desktop actual local RTP decoded PCM quality A/B (synthetic)

on:
  pull_request:
    paths:
      - 'bench-ui/audio-quality-*'
      - '.github/workflows/desktop-audio-quality-ab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-rtp-pcm:
    name: Electron decoded PCM fidelity / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install locked UI and real Electron dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix electron --no-audit --no-fund
          npm ci --prefix bench-ui --no-audit --no-fund
      - name: Install pinned real Electron binary
        run: node electron/node_modules/electron/install.js
      - name: Install Linux X server
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth
      - name: Build identical UI fixtures and verify fail-closed audio contracts
        run: |
          node bench-ui/build-assets.mjs
          node --test --test-concurrency=1 bench-ui/audio-quality-*.test.cjs
      - name: Measure actually decoded local WebRTC PCM on Electron
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a electron/node_modules/electron/dist/electron --no-sandbox bench-ui/audio-quality-electron.cjs 2>&1 | tee audio-quality-ab.log
          else
            node electron/node_modules/electron/cli.js --no-sandbox bench-ui/audio-quality-electron.cjs 2>&1 | tee audio-quality-ab.log
          fi
          node bench-ui/audio-quality-report.cjs
      - name: Preserve first attempt and incomplete quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-audio-quality-${{ matrix.os }}-${{ github.sha }}
          path: |
            bench-ui/generated/audio-quality-report.json
            audio-quality-ab.log
          if-no-files-found: warn
          retention-days: 14
