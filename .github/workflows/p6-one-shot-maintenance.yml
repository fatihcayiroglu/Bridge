name: P6 One-shot Maintenance

on:
  push:
    branches: [gpt/p6-closure]
    paths:
      - .github/workflows/p6-one-shot-maintenance.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'fatihcayiroglu/Bridge'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gpt/p6-closure
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Remove unused nodemon and add Remote DM locale keys
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path

          for path in [Path('package.json'), Path('server/package.json')]:
              data = json.loads(path.read_text())
              removed = data.get('devDependencies', {}).pop('nodemon', None)
              if removed is None:
                  raise SystemExit(f'{path}: nodemon was not present')
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          guide = Path('DEVELOPER_GUIDE.md')
          text = guide.read_text()
          old = '# Sunucuyu nodemon ile başlat (otomatik reload)'
          new = '# Sunucuyu otomatik yeniden yüklemeli geliştirme modunda başlat'
          if old not in text:
              raise SystemExit('DEVELOPER_GUIDE nodemon wording not found')
          guide.write_text(text.replace(old, new, 1))

          panel = Path('client/js/core/RemoteDmPanel.svelte')
          text = panel.read_text()
          replacements = {
              "t('ui_kapat', 'Kapat')": "t('close', 'Kapat')",
              "t('ui_yukleniyor', 'Yükleniyor…')": "t('loading', 'Yükleniyor…')",
              "t('remote_dm_message', 'Mesaj')": "t('dm_message', 'Mesaj')",
              "t('ui_iptal', 'İptal')": "t('cancel', 'İptal')",
              "t('ui_gonderiliyor', 'Gönderiliyor…')": "t('dm_sending', 'Gönderiliyor…')",
              "t('ui_gonder', 'Gönder')": "t('dm_send', 'Gönder')",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'RemoteDmPanel replacement not found: {old}')
              text = text.replace(old, new)
          panel.write_text(text)

          translations = {
            'tr': {
              'remote_dm_load_failed': 'Federated mesajlar yüklenemedi.',
              'remote_dm_target_content_required': 'Uzak aktör adresi ve mesaj gerekli.',
              'remote_dm_sent': 'Federated mesaj teslimat kuyruğuna alındı.',
              'remote_dm_send_failed': 'Federated mesaj gönderilemedi.',
              'remote_dm_title': 'Federated direkt mesajlar',
              'remote_dm_hint': 'Diğer ActivityPub sunucularından sana gelen özel mesajlar.',
              'remote_dm_empty': 'Henüz federated özel mesaj yok.',
              'remote_dm_compose': 'Federated mesaj gönder',
              'remote_dm_actor_url': 'Uzak aktör adresi',
              'remote_dm_message_placeholder': 'Mesajını yaz…',
              'remote_dm_entry': 'Federated',
              'remote_dm_open': 'Federated direkt mesajları aç',
            },
            'en': {
              'remote_dm_load_failed': 'Federated messages could not be loaded.',
              'remote_dm_target_content_required': 'Remote actor address and message are required.',
              'remote_dm_sent': 'Federated message queued for delivery.',
              'remote_dm_send_failed': 'Federated message could not be sent.',
              'remote_dm_title': 'Federated direct messages',
              'remote_dm_hint': 'Private messages sent to you from other ActivityPub servers.',
              'remote_dm_empty': 'No federated private messages yet.',
              'remote_dm_compose': 'Send federated message',
              'remote_dm_actor_url': 'Remote actor address',
              'remote_dm_message_placeholder': 'Write your message…',
              'remote_dm_entry': 'Federated',
              'remote_dm_open': 'Open federated direct messages',
            },
            'es': {
              'remote_dm_load_failed': 'No se pudieron cargar los mensajes federados.',
              'remote_dm_target_content_required': 'Se requieren la dirección del actor remoto y el mensaje.',
              'remote_dm_sent': 'Mensaje federado añadido a la cola de entrega.',
              'remote_dm_send_failed': 'No se pudo enviar el mensaje federado.',
              'remote_dm_title': 'Mensajes directos federados',
              'remote_dm_hint': 'Mensajes privados que recibes desde otros servidores ActivityPub.',
              'remote_dm_empty': 'Aún no hay mensajes privados federados.',
              'remote_dm_compose': 'Enviar mensaje federado',
              'remote_dm_actor_url': 'Dirección del actor remoto',
              'remote_dm_message_placeholder': 'Escribe tu mensaje…',
              'remote_dm_entry': 'Federados',
              'remote_dm_open': 'Abrir mensajes directos federados',
            },
            'ru': {
              'remote_dm_load_failed': 'Не удалось загрузить федеративные сообщения.',
              'remote_dm_target_content_required': 'Нужны адрес удалённого актора и текст сообщения.',
              'remote_dm_sent': 'Федеративное сообщение поставлено в очередь доставки.',
              'remote_dm_send_failed': 'Не удалось отправить федеративное сообщение.',
              'remote_dm_title': 'Федеративные личные сообщения',
              'remote_dm_hint': 'Личные сообщения с других серверов ActivityPub.',
              'remote_dm_empty': 'Федеративных личных сообщений пока нет.',
              'remote_dm_compose': 'Отправить федеративное сообщение',
              'remote_dm_actor_url': 'Адрес удалённого актора',
              'remote_dm_message_placeholder': 'Введите сообщение…',
              'remote_dm_entry': 'Федерация',
              'remote_dm_open': 'Открыть федеративные личные сообщения',
            },
            'ja': {
              'remote_dm_load_failed': 'フェデレーションメッセージを読み込めませんでした。',
              'remote_dm_target_content_required': 'リモートアクターのアドレスとメッセージが必要です。',
              'remote_dm_sent': 'フェデレーションメッセージを配信キューに追加しました。',
              'remote_dm_send_failed': 'フェデレーションメッセージを送信できませんでした。',
              'remote_dm_title': 'フェデレーションDM',
              'remote_dm_hint': '他の ActivityPub サーバーから届いた非公開メッセージです。',
              'remote_dm_empty': 'フェデレーションDMはまだありません。',
              'remote_dm_compose': 'フェデレーションメッセージを送信',
              'remote_dm_actor_url': 'リモートアクターのアドレス',
              'remote_dm_message_placeholder': 'メッセージを入力…',
              'remote_dm_entry': 'フェデレーション',
              'remote_dm_open': 'フェデレーションDMを開く',
            },
            'ko': {
              'remote_dm_load_failed': '페더레이션 메시지를 불러오지 못했습니다.',
              'remote_dm_target_content_required': '원격 액터 주소와 메시지가 필요합니다.',
              'remote_dm_sent': '페더레이션 메시지를 전송 대기열에 추가했습니다.',
              'remote_dm_send_failed': '페더레이션 메시지를 보내지 못했습니다.',
              'remote_dm_title': '페더레이션 다이렉트 메시지',
              'remote_dm_hint': '다른 ActivityPub 서버에서 받은 비공개 메시지입니다.',
              'remote_dm_empty': '아직 페더레이션 비공개 메시지가 없습니다.',
              'remote_dm_compose': '페더레이션 메시지 보내기',
              'remote_dm_actor_url': '원격 액터 주소',
              'remote_dm_message_placeholder': '메시지 작성…',
              'remote_dm_entry': '페더레이션',
              'remote_dm_open': '페더레이션 다이렉트 메시지 열기',
            },
            'zh': {
              'remote_dm_load_failed': '无法加载联邦消息。',
              'remote_dm_target_content_required': '需要远程参与者地址和消息内容。',
              'remote_dm_sent': '联邦消息已加入投递队列。',
              'remote_dm_send_failed': '无法发送联邦消息。',
              'remote_dm_title': '联邦私信',
              'remote_dm_hint': '来自其他 ActivityPub 服务器的私密消息。',
              'remote_dm_empty': '还没有联邦私信。',
              'remote_dm_compose': '发送联邦消息',
              'remote_dm_actor_url': '远程参与者地址',
              'remote_dm_message_placeholder': '输入消息…',
              'remote_dm_entry': '联邦',
              'remote_dm_open': '打开联邦私信',
            },
            'pt': {
              'remote_dm_load_failed': 'Não foi possível carregar as mensagens federadas.',
              'remote_dm_target_content_required': 'O endereço do ator remoto e a mensagem são obrigatórios.',
              'remote_dm_sent': 'Mensagem federada adicionada à fila de entrega.',
              'remote_dm_send_failed': 'Não foi possível enviar a mensagem federada.',
              'remote_dm_title': 'Mensagens diretas federadas',
              'remote_dm_hint': 'Mensagens privadas recebidas de outros servidores ActivityPub.',
              'remote_dm_empty': 'Ainda não há mensagens privadas federadas.',
              'remote_dm_compose': 'Enviar mensagem federada',
              'remote_dm_actor_url': 'Endereço do ator remoto',
              'remote_dm_message_placeholder': 'Escreva sua mensagem…',
              'remote_dm_entry': 'Federado',
              'remote_dm_open': 'Abrir mensagens diretas federadas',
            },
            'de': {
              'remote_dm_load_failed': 'Föderierte Nachrichten konnten nicht geladen werden.',
              'remote_dm_target_content_required': 'Adresse des entfernten Akteurs und Nachricht sind erforderlich.',
              'remote_dm_sent': 'Föderierte Nachricht wurde zur Zustellung eingereiht.',
              'remote_dm_send_failed': 'Föderierte Nachricht konnte nicht gesendet werden.',
              'remote_dm_title': 'Föderierte Direktnachrichten',
              'remote_dm_hint': 'Private Nachrichten von anderen ActivityPub-Servern.',
              'remote_dm_empty': 'Noch keine föderierten privaten Nachrichten.',
              'remote_dm_compose': 'Föderierte Nachricht senden',
              'remote_dm_actor_url': 'Adresse des entfernten Akteurs',
              'remote_dm_message_placeholder': 'Nachricht schreiben…',
              'remote_dm_entry': 'Föderiert',
              'remote_dm_open': 'Föderierte Direktnachrichten öffnen',
            },
            'fr': {
              'remote_dm_load_failed': 'Impossible de charger les messages fédérés.',
              'remote_dm_target_content_required': 'L’adresse de l’acteur distant et le message sont requis.',
              'remote_dm_sent': 'Message fédéré ajouté à la file de livraison.',
              'remote_dm_send_failed': 'Impossible d’envoyer le message fédéré.',
              'remote_dm_title': 'Messages directs fédérés',
              'remote_dm_hint': 'Messages privés reçus depuis d’autres serveurs ActivityPub.',
              'remote_dm_empty': 'Aucun message privé fédéré pour le moment.',
              'remote_dm_compose': 'Envoyer un message fédéré',
              'remote_dm_actor_url': 'Adresse de l’acteur distant',
              'remote_dm_message_placeholder': 'Écrivez votre message…',
              'remote_dm_entry': 'Fédéré',
              'remote_dm_open': 'Ouvrir les messages directs fédérés',
            },
          }

          for locale, mapping in translations.items():
              path = Path(f'client/js/core/i18n/{locale}.ts')
              text = path.read_text()
              for key in mapping:
                  if f"'{key}'" in text or f'"{key}"' in text:
                      raise SystemExit(f'{path}: duplicate key {key}')
              export_pos = text.rfind('export default translations;')
              if export_pos < 0:
                  raise SystemExit(f'{path}: export marker missing')
              close_pos = text.rfind('};', 0, export_pos)
              if close_pos < 0:
                  raise SystemExit(f'{path}: translations closing marker missing')
              lines = ['  // P6 — Remote ActivityPub direct messages.']
              for key, value in mapping.items():
                  lines.append(f'  {json.dumps(key, ensure_ascii=False)}: {json.dumps(value, ensure_ascii=False)},')
              insertion = '\n' + '\n'.join(lines) + '\n'
              text = text[:close_pos] + insertion + text[close_pos:]
              path.write_text(text)
          PY

          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          (cd server && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)

          npm run check:i18n
          npm audit --audit-level=high
          (cd server && npm audit --audit-level=high --omit=dev)
          git diff --check

      - name: Commit repaired source and generated lockfiles
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/p6-one-shot-maintenance.yml
          git config user.name 'Bridge CI Maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add package.json package-lock.json server/package.json server/package-lock.json DEVELOPER_GUIDE.md client/js/core/RemoteDmPanel.svelte client/js/core/i18n .github/workflows/p6-one-shot-maintenance.yml
          git commit -m 'fix(p6): close security audit and Remote DM i18n blockers'
          git push origin HEAD:gpt/p6-closure
