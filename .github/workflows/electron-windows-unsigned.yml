name: Electron Windows Unsigned

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build'
        required: true
        default: 'v1.122.0'

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  windows-unsigned:
    name: Windows unsigned installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install root deps
        run: npm ci

      - name: Install server deps
        run: cd server && npm ci

      - name: Build server
        run: cd server && npm run build

      - name: Install Electron deps
        run: cd electron && npm ci

      - name: Disable Windows signing for unsigned build
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const file = 'electron/package.json';
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
          pkg.build = pkg.build || {};
          pkg.build.win = pkg.build.win || {};
          delete pkg.build.win.signtoolOptions;
          pkg.build.win.signExecutable = false;
          pkg.build.win.verifyUpdateCodeSignature = false;
          pkg.build.publish = {
            provider: 'github',
            owner: 'fatihcayiroglu',
            repo: 'Bridge'
          };
          fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Build Windows unsigned
        shell: bash
        run: |
          cd electron
          npm run compile
          npx electron-builder --win nsis:x64 nsis:arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to GitHub Release
        shell: bash
        run: |
          shopt -s nullglob
          files=(
            electron/release/*.exe
            electron/release/*.blockmap
            electron/release/latest.yml
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "Release upload için dosya bulunamadı."
            exit 1
          fi

          printf '%s\n' "${files[@]}"

          gh release upload "${{ inputs.tag }}" "${files[@]}" \
            --repo fatihcayiroglu/Bridge \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show artifacts
        shell: bash
        run: |
          find electron/release -maxdepth 1 -type f -print
