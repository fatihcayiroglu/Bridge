name: Native pilot signed-out screen layout smoke
on:
  pull_request:
    paths:
      - 'mobile-native-pilot/**'
      - '.github/workflows/native-pilot-layout-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  CI: '1'
  NODE_OPTIONS: --dns-result-order=ipv4first
  EXPO_PUBLIC_NATIVE_SELF_TEST: '0'
  # Deliberate non-production fixture origin. Only the signed-out UI is tested;
  # no authentication or backend integration claim is made by this workflow.
  EXPO_PUBLIC_BRIDGE_ORIGIN: https://127.0.0.1:8443
jobs:
  android-screen-layouts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile-native-pilot
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Exact-head test and signed-out native APK
        run: |
          set -euo pipefail
          mkdir -p native-evidence/layout-android
          git rev-parse HEAD > native-evidence/layout-android/head.txt
          npm ci --no-fund
          npm audit --audit-level=low
          npm test
          npx expo prebuild --platform android --no-install
          cd android
          ./gradlew :app:assembleDebug -PreactNativeArchitectures=x86_64 --no-daemon --max-workers=2 2>&1 | tee ../native-evidence/layout-android/build.log
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Enable runner KVM
        run: sudo chmod 666 /dev/kvm
      - name: Test four real rendered Android viewport layouts
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash mobile-native-pilot/scripts/android-layout-smoke.sh
      - name: Save Android screens and exact verdicts, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-layout-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: mobile-native-pilot/native-evidence/layout-android/
          retention-days: 7
          if-no-files-found: error

  ios-screen-layouts:
    runs-on: macos-15
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile-native-pilot
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Exact-head tests and native iOS dependencies
        run: |
          set -euo pipefail
          mkdir -p native-evidence/layout-ios
          git rev-parse HEAD > native-evidence/layout-ios/head.txt
          test -d /Applications/Xcode_26.3.app/Contents/Developer
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version > native-evidence/layout-ios/xcode.txt
          npm ci --no-fund
          npm audit --audit-level=low
          npm test
          npx expo prebuild --platform ios --no-install
          PREFETCH_EVIDENCE=native-evidence/layout-ios/prefetch.json node scripts/prefetch-ios-prebuilt.mjs
          cd ios
          pod install 2>&1 | tee ../native-evidence/layout-ios/pods.log
      - name: Build normal signed-out iOS simulator app once
        run: |
          set -euo pipefail
          workspace=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$workspace"
          xcodebuild -workspace "$workspace" -list -json > native-evidence/layout-ios/schemes.json
          scheme=$(python3 -c 'import json; d=json.load(open("native-evidence/layout-ios/schemes.json")); print(next(s for s in d["workspace"]["schemes"] if s.startswith("Bridge")))')
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/bridge-layout-ios" CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build 2>&1 | tee native-evidence/layout-ios/build.log
          app=$(find "$RUNNER_TEMP/bridge-layout-ios/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          codesign --verify --strict "$app"
      - name: Test small, standard, large iPhone and iPad simulator screens
        run: bash scripts/ios-layout-smoke.sh
      - name: Save iOS screenshots, device selection and verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-layout-ios-${{ github.run_id }}-${{ github.run_attempt }}
          path: mobile-native-pilot/native-evidence/layout-ios/
          retention-days: 7
          if-no-files-found: error
