name: Native pilot marker unit tests (not product acceptance)

on:
  pull_request:
    paths:
      - 'mobile-native-pilot/**'
      - '.github/workflows/native-pilot-marker-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  marker-unit-only:
    name: JS marker unit tests only - NOT Android/iOS parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Test isolated JS marker semantics (no retries)
        working-directory: mobile-native-pilot
        run: npm test
