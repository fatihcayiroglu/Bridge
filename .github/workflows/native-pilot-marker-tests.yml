name: Native pilot checks (NOT product acceptance)

on:
  pull_request:
    paths:
      - 'mobile-native-pilot/**'
      - '.github/workflows/native-pilot-marker-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-unit-contracts:
    name: JS marker/API/storage unit tests - NOT Android/iOS parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Test isolated JS marker, read-only API and storage contracts (no retries)
        working-directory: mobile-native-pilot
        run: npm test

  js-build-and-typecheck:
    name: Expo JS typecheck and Android/iOS bundles - NOT native binaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile-native-pilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Install isolated pilot dependencies from the committed lockfile
        run: npm ci --no-fund
      - name: Type-check RN prototype
        run: npm run typecheck
      - name: Export Android JS bundle (not APK)
        run: npx expo export --platform android --output-dir ./ci-export-android
      - name: Export iOS JS bundle (not IPA)
        run: npx expo export --platform ios --output-dir ./ci-export-ios

  dependency-audit:
    # Gating and unsuppressed: any advisory at high or above fails this job until
    # it is fixed or the owner records an explicit decision. See
    # mobile-native-pilot/DEPENDENCY_AUDIT.md for the current findings.
    name: Pilot dependency audit (npm audit, high+)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile-native-pilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Audit the committed lockfile
        run: npm audit --audit-level=high
