name: Bridge CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ──────────────────────────────────────────────────────────────
  # 1. Lint & Typecheck
  # ──────────────────────────────────────────────────────────────
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server deps
        run: cd server && npm ci

      - name: TypeScript — server
        run: cd server && npm run typecheck

      - name: ESLint — server
        run: cd server && npm run lint

      - name: ADR-0008 — Svelte servis katmanı sınır kontrolü
        run: bash scripts/check-svelte-boundary.sh

      - name: i18n parity kontrolü
        run: node scripts/check-i18n-parity.js

      - name: Bundle budget kontrolü
        run: |
          cd server && npm run build 2>/dev/null || true
          cd .. && node scripts/check-bundle-budget.js 2>/dev/null || echo "::warning::Bundle budget kontrolü atlandı (build gerekli)"

  # ──────────────────────────────────────────────────────────────
  # 2. Server Unit Tests
  # ──────────────────────────────────────────────────────────────
  server-tests:
    name: Server Tests (Jest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bridge_test
          POSTGRES_USER: bridge
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://bridge:test_password@localhost:5432/bridge_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci_test_jwt_secret_minimum_32_chars_required
      REFRESH_SECRET: ci_test_refresh_secret_minimum_32_chars
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server deps
        run: cd server && npm ci

      - name: Run Jest tests with coverage
        run: cd server && npm run test:coverage -- --forceExit --runInBand

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: server/coverage/
          retention-days: 14

  # ──────────────────────────────────────────────────────────────
  # 3. CI Guard: Kritik Dosya & Yapısal Kontroller
  # ──────────────────────────────────────────────────────────────
  structural-guards:
    name: Structural Guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Storybook — yapılandırma dosyaları mevcut olmalı (ADR-0008 Faz 3)
        run: |
          test -f client/.storybook/main.ts    || (echo "❌ client/.storybook/main.ts eksik"    && exit 1)
          test -f client/.storybook/preview.ts || (echo "❌ client/.storybook/preview.ts eksik" && exit 1)
          STORY_COUNT=$(find client/stories -name "*.stories.ts" 2>/dev/null | wc -l)
          echo "Story dosyası sayısı: $STORY_COUNT"
          [ "$STORY_COUNT" -ge 13 ] || (echo "❌ En az 13 story dosyası gerekli, mevcut: $STORY_COUNT" && exit 1)
          echo "✅ Storybook yapılandırması tamam"

      - name: pgvector — migration SQL doğrulama
        run: |
          grep -r "CREATE EXTENSION.*vector" server/db/migrations/ || \
          grep -r "CREATE EXTENSION.*vector" server/db/migrations_pg/ || \
          (echo "❌ pgvector extension migration bulunamadı" && exit 1)
          echo "✅ pgvector migration mevcut"

      - name: Vault — secrets adapter mevcut olmalı
        run: |
          test -f server/lib/vault.ts || (echo "❌ server/lib/vault.ts eksik" && exit 1)
          grep -q "getSecret" server/lib/vault.ts || (echo "❌ vault.ts getSecret fonksiyonu eksik" && exit 1)
          echo "✅ Vault adapter mevcut"

      - name: ActivityPub C2S — outbox POST endpoint mevcut olmalı
        run: |
          grep -r "outbox" server/routes/federation/ --include="*.ts" -l | head -1 | \
          xargs test -f 2>/dev/null || (echo "❌ ActivityPub C2S outbox endpoint bulunamadı" && exit 1)
          echo "✅ ActivityPub C2S outbox mevcut"

      - name: Federation RSA — httpSignatureV3 mevcut olmalı
        run: |
          test -f server/lib/httpSignatureV3.ts || (echo "❌ httpSignatureV3.ts eksik" && exit 1)
          grep -q "verifyFederationRequestV3" server/lib/httpSignatureV3.ts || \
            (echo "❌ verifyFederationRequestV3 fonksiyonu eksik" && exit 1)
          echo "✅ Federation RSA V3 mevcut"

      - name: DiscoverPanel — Svelte bileşeni mevcut olmalı (Sprint 114)
        run: |
          test -f client/js/core/DiscoverPanel.svelte || \
            (echo "❌ client/js/core/DiscoverPanel.svelte eksik — Sprint 114 hedefi" && exit 1)
          echo "✅ DiscoverPanel.svelte mevcut"

      - name: discover-svelte.ts — mount shim mevcut olmalı (Sprint 114)
        run: |
          test -f client/js/core/discover-svelte.ts || \
            (echo "❌ client/js/core/discover-svelte.ts eksik — Sprint 114 mount shim" && exit 1)
          echo "✅ discover-svelte.ts mevcut"

      - name: DB schema — migration sayısı kontrolü
        run: |
          SQL_COUNT=$(find server/db/migrations_pg -name "*.sql" 2>/dev/null | wc -l)
          echo "Migration dosyası sayısı: $SQL_COUNT"
          [ "$SQL_COUNT" -ge 10 ] || (echo "❌ Beklenenden az migration dosyası" && exit 1)
          echo "✅ Migration dosyaları tamam"

  # ──────────────────────────────────────────────────────────────
  # 4. E2E Tests (Playwright) — sadece main branch'te
  # ──────────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'push'
    needs: [server-tests]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bridge_e2e
          POSTGRES_USER: bridge
          POSTGRES_PASSWORD: e2e_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://bridge:e2e_password@localhost:5432/bridge_e2e
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: e2e_jwt_secret_minimum_32_chars_required_here
      REFRESH_SECRET: e2e_refresh_secret_minimum_32_chars_here
      NODE_ENV: test
      PORT: 3001

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server deps
        run: cd server && npm ci

      - name: Build server
        run: cd server && npm run build

      - name: Install Playwright & E2E deps
        run: |
          cd e2e && npm ci
          npx playwright install --with-deps chromium

      - name: Start Bridge server
        run: |
          cd server && node dist/index.js &
          sleep 5
          curl -f http://localhost:3001/api/health || (echo "Server başlamadı" && exit 1)

      - name: Run Playwright E2E tests
        run: cd e2e && npx playwright test --reporter=html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # 5. Security Audit
  # ──────────────────────────────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: npm audit — server (high+critical only)
        run: cd server && npm audit --audit-level=high --production || echo "::warning::Güvenlik açıkları mevcut — incelenmeli"

      - name: Secrets pattern taraması
        run: |
          # Hardcoded secret pattern kontrolü (basic)
          VIOLATIONS=$(grep -rn \
            -e "password\s*=\s*['\"][^'\"]\{8,\}['\"]" \
            -e "secret\s*=\s*['\"][^'\"]\{16,\}['\"]" \
            --include="*.ts" --include="*.js" \
            server/routes/ server/lib/ server/middleware/ \
            2>/dev/null | grep -v ".test." | grep -v "example\|placeholder\|YOUR_" | head -5 || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::warning::Potansiyel hardcoded secret pattern tespit edildi:"
            echo "$VIOLATIONS"
          else
            echo "✅ Hardcoded secret taraması temiz"
          fi

  # ──────────────────────────────────────────────────────────────
  # 6. SAST — Static Application Security Testing
  # ──────────────────────────────────────────────────────────────
  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: +security-and-quality

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install deps
        run: cd server && npm ci

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  # ──────────────────────────────────────────────────────────────
  # 7. Dependency Review — PR'larda yeni bağımlılık güvenlik taraması
  # ──────────────────────────────────────────────────────────────
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  # ──────────────────────────────────────────────────────────────
  # 8. Smoke Load Test — Staging ortamında k6
  # ──────────────────────────────────────────────────────────────
  smoke-load-test:
    name: Smoke Load Test (k6)
    runs-on: ubuntu-latest
    needs: [server-tests]
    if: github.ref == 'refs/heads/main'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bridge_load
          POSTGRES_USER: bridge
          POSTGRES_PASSWORD: load_password
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://bridge:load_password@localhost:5432/bridge_load
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: load_test_jwt_secret_minimum_32_chars
      REFRESH_SECRET: load_test_refresh_secret_minimum_32_chars
      NODE_ENV: production
      PORT: 3001
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server deps
        run: cd server && npm ci

      - name: Build and start server
        run: |
          cd server && npm run build
          node dist/index.js &
          sleep 8
          curl -f http://localhost:3001/api/health

      - name: Setup k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6

      - name: Run k6 smoke test
        run: |
          BASE_URL=http://localhost:3001 k6 run \
            --out json=k6-results.json \
            --summary-export=k6-summary.json \
            k6/smoke.js

      - name: Upload k6 results
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-test-results
          path: |
            k6-results.json
            k6-summary.json
          retention-days: 30

      - name: Check k6 thresholds
        run: |
          ERROR_RATE=$(cat k6-summary.json | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          rate=d.get('metrics',{}).get('smoke_errors',{}).get('values',{}).get('rate',0)
          print(f'{rate:.4f}')
          ")
          echo "Error rate: $ERROR_RATE"
          python3 -c "
          rate=float('$ERROR_RATE')
          if rate > 0.01:
            print(f'FAIL: Error rate {rate:.2%} > 1% threshold')
            exit(1)
          print(f'PASS: Error rate {rate:.2%}')
          "

  # ──────────────────────────────────────────────────────────────
  # Sprint 115 structural guards (ek)
  # ──────────────────────────────────────────────────────────────
  structural-guards-115:
    name: Structural Guards Sprint 115
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: DmCallPanel — Svelte geçişi tamamlandı
        run: |
          test -f client/js/core/DmCallPanel.svelte || (echo "❌ DmCallPanel.svelte eksik" && exit 1)
          test -f client/js/core/dm-call-svelte.ts || (echo "❌ dm-call-svelte.ts eksik" && exit 1)
          echo "✅ DmCallPanel geçişi tamam"

      - name: SearchPanel — Svelte geçişi tamamlandı
        run: |
          test -f client/js/core/SearchPanel.svelte || (echo "❌ SearchPanel.svelte eksik" && exit 1)
          test -f client/js/core/search-svelte.ts || (echo "❌ search-svelte.ts eksik" && exit 1)
          echo "✅ SearchPanel geçişi tamam"

      - name: E2EE — production default true
        run: |
          grep -q "BRIDGE_E2EE_ENABLED !== 'false'" \
            server/socket/handlers/channelE2EEHandlers.ts || \
            (echo "❌ E2EE varsayılan true değil" && exit 1)
          echo "✅ E2EE production-ready"

      - name: Storybook — en az 8 story dosyası
        run: |
          COUNT=$(find client/stories -name "*.stories.ts" | wc -l)
          echo "Story sayısı: $COUNT"
          [ "$COUNT" -ge 13 ] || (echo "❌ En az 13 story gerekli, mevcut: $COUNT" && exit 1)
          echo "✅ Storybook coverage tamam"

      - name: Mobile — iOS native proje mevcut
        run: |
          test -f mobile/ios/App/App/Info.plist || (echo "❌ iOS Info.plist eksik" && exit 1)
          test -f mobile/ios/App/App/AppDelegate.swift || (echo "❌ AppDelegate.swift eksik" && exit 1)
          echo "✅ iOS native proje mevcut"

      - name: Mobile — Android native proje mevcut
        run: |
          test -f mobile/android/app/src/main/AndroidManifest.xml || \
            (echo "❌ AndroidManifest.xml eksik" && exit 1)
          test -f mobile/android/app/src/main/java/com/bridge/app/MainActivity.kt || \
            (echo "❌ MainActivity.kt eksik" && exit 1)
          echo "✅ Android native proje mevcut"

      - name: Electron — release pipeline mevcut
        run: |
          test -f .github/workflows/electron-release.yml || \
            (echo "❌ electron-release.yml eksik" && exit 1)
          grep -q "electron-builder" electron/package.json || \
            (echo "❌ electron-builder konfigürasyonu eksik" && exit 1)
          echo "✅ Electron release pipeline tamam"

      - name: Versiyon tutarlılığı
        run: |
          ROOT_VER=$(node -p "require('./package.json').version" 2>/dev/null || echo "")
          SERVER_VER=$(node -p "require('./server/package.json').version" 2>/dev/null || echo "")
          if [ "$ROOT_VER" != "$SERVER_VER" ]; then
            echo "❌ Versiyon tutarsız: root=$ROOT_VER server=$SERVER_VER"
            exit 1
          fi
          echo "✅ Versiyon tutarlı: $ROOT_VER"

      - name: Tombstone stub'lar kaldırıldı
        run: |
          if [ -f client/js/core/discover.ts ]; then
            grep -q "export {}" client/js/core/discover.ts && \
              (echo "❌ discover.ts tombstone stub hâlâ mevcut — silinmeli" && exit 1) || true
          fi
          echo "✅ Legacy stub temizliği tamam"

  # ──────────────────────────────────────────────────────────────
  # Sprint 116 ADR-0008 Faz 3 — Migration tamamlandı
  # ──────────────────────────────────────────────────────────────
  svelte-migration-complete:
    name: ADR-0008 Faz 3 — Svelte Migration Complete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Core'da sıfır vanilla TS
        run: |
          COUNT=$(find client/js/core -name "*.ts" \
            -not -path "client/js/core/_legacy/*" \
            -not -name "*.test.*" \
            -not -name "*-svelte.ts" \
            -not -name "*.d.ts" \
            -not -name "bridge-registry.ts" \
            -not -name "logger.ts" \
            | wc -l)
          echo "Core vanilla TS sayısı: $COUNT"
          [ "$COUNT" -eq 0 ] || (
            echo "❌ ADR-0008 ihlali: $COUNT vanilla TS dosyası hâlâ core'da"
            find client/js/core -name "*.ts" \
              -not -path "client/js/core/_legacy/*" \
              -not -name "*.test.*" \
              -not -name "*-svelte.ts" \
              -not -name "*.d.ts" \
              -not -name "bridge-registry.ts" \
              -not -name "logger.ts"
            exit 1
          )
          echo "✅ ADR-0008 Faz 3: Tüm bileşenler Svelte'e geçirildi"

      - name: Svelte bileşen sayısı ≥ 140
        run: |
          COUNT=$(find client/js/core -name "*.svelte" -not -path "*/_legacy/*" | wc -l)
          echo "Svelte bileşen sayısı: $COUNT"
          [ "$COUNT" -ge 140 ] || (echo "❌ Svelte bileşen sayısı beklenenden düşük: $COUNT" && exit 1)
          echo "✅ $COUNT Svelte bileşeni mevcut"

      - name: Mount shim coverage
        run: |
          COUNT=$(find client/js/core -name "*-svelte.ts" -not -path "*/_legacy/*" | wc -l)
          echo "Mount shim sayısı: $COUNT"
          [ "$COUNT" -ge 120 ] || (echo "❌ Mount shim sayısı beklenenden düşük: $COUNT" && exit 1)
          echo "✅ $COUNT mount shim mevcut"

      - name: Legacy arşiv sağlıklı
        run: |
          COUNT=$(find client/js/core/_legacy -name "*.ts" | wc -l)
          echo "Legacy arşiv: $COUNT dosya"
          # Her legacy dosyasında LEGACY header olmalı
          MISSING=$(grep -rL "LEGACY" client/js/core/_legacy/ --include="*.ts" | wc -l)
          [ "$MISSING" -eq 0 ] || (echo "❌ $MISSING legacy dosyasında header eksik" && exit 1)
          echo "✅ Legacy arşiv sağlıklı: $COUNT dosya, hepsinde header var"
