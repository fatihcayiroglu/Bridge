# ──────────────────────────────────────────────────────────────
# YENİ SCHEMA TANIMLARI
# ──────────────────────────────────────────────────────────────



    # Webhook
    Webhook:
      type: object
      properties:
        _id:       { type: string }
        serverId:  { type: string }
        channelId: { type: string }
        name:      { type: string }
        token:     { type: string, description: "Yalnızca oluşturma anında döner" }
        avatar:    { type: string, nullable: true }
        active:    { type: boolean }
        createdAt: { type: integer }

    CreateWebhookRequest:
      type: object
      required: [name, channelId]
      properties:
        name:      { type: string, minLength: 1, maxLength: 80 }
        channelId: { type: string }
        avatar:    { type: string, nullable: true }

    UpdateWebhookRequest:
      type: object
      properties:
        name:      { type: string, minLength: 1, maxLength: 80 }
        channelId: { type: string }
        active:    { type: boolean }
        avatar:    { type: string, nullable: true }

    WebhookTriggerRequest:
      type: object
      properties:
        content:   { type: string, maxLength: 2000 }
        username:  { type: string, maxLength: 80, description: "Override gönderen adı" }
        avatar_url: { type: string, nullable: true }
        embeds:
          type: array
          maxItems: 10
          items:
            type: object
            properties:
              title:       { type: string }
              description: { type: string }
              color:       { type: integer }
              url:         { type: string }
              timestamp:   { type: string, format: date-time }

    # Plugin
    PluginEntry:
      type: object
      properties:
        _id:         { type: string }
        pluginId:    { type: string }
        name:        { type: string }
        description: { type: string }
        author:      { type: string }
        version:     { type: string }
        isFeatured:  { type: boolean }
        installCount: { type: integer }
        tags:
          type: array
          items: { type: string }
        createdAt:   { type: integer }

    InstalledPlugin:
      type: object
      properties:
        serverId:   { type: string }
        pluginId:   { type: string }
        name:       { type: string }
        version:    { type: string }
        active:     { type: boolean }
        installedAt: { type: integer }

    # Federation
    WebFingerResponse:
      type: object
      properties:
        subject: { type: string }
        aliases:
          type: array
          items: { type: string }
        links:
          type: array
          items:
            type: object
            properties:
              rel:  { type: string }
              type: { type: string }
              href: { type: string }

    NodeInfoIndex:
      type: object
      properties:
        links:
          type: array
          items:
            type: object
            properties:
              rel:  { type: string }
              href: { type: string }

    NodeInfo:
      type: object
      properties:
        version:  { type: string }
        software:
          type: object
          properties:
            name:    { type: string }
            version: { type: string }
        protocols:
          type: array
          items: { type: string }
        usage:
          type: object
          properties:
            users:
              type: object
              properties:
                total:          { type: integer }
                activeMonth:    { type: integer }
                activeHalfyear: { type: integer }
            localPosts: { type: integer }
        openRegistrations: { type: boolean }

    ActivityPubActor:
      type: object
      properties:
        "@context": { type: array, items: { type: string } }
        type:       { type: string, enum: [Person, Service] }
        id:         { type: string, format: uri }
        name:       { type: string }
        preferredUsername: { type: string }
        summary:    { type: string, nullable: true }
        inbox:      { type: string, format: uri }
        outbox:     { type: string, format: uri }
        followers:  { type: string, format: uri }
        following:  { type: string, format: uri }
        publicKey:
          type: object
          properties:
            id:           { type: string }
            owner:        { type: string }
            publicKeyPem: { type: string }

    ActivityPubActivity:
      type: object
      properties:
        "@context": { type: string }
        type:       { type: string, enum: [Follow, Undo, Accept, Reject, Create, Update, Delete, Like, Announce] }
        id:         { type: string, format: uri }
        actor:      { type: string, format: uri }
        object:     {}

    ActivityPubOrderedCollection:
      type: object
      properties:
        "@context": { type: string }
        type:       { type: string, enum: [OrderedCollection, OrderedCollectionPage] }
        id:         { type: string, format: uri }
        totalItems: { type: integer }
        first:      { type: string, format: uri, nullable: true }
        last:       { type: string, format: uri, nullable: true }
        orderedItems:
          type: array
          items: {}

    # Admin — yeni
    ReactionRoleRule:
      type: object
      properties:
        _id:       { type: string }
        serverId:  { type: string }
        channelId: { type: string }
        messageId: { type: string }
        emoji:     { type: string }
        roleId:    { type: string }
        createdAt: { type: integer }

    CreateReactionRoleRequest:
      type: object
      required: [serverId, channelId, messageId, emoji, roleId]
      properties:
        serverId:  { type: string }
        channelId: { type: string }
        messageId: { type: string }
        emoji:     { type: string }
        roleId:    { type: string }

    BotMarketplaceEntry:
      type: object
      properties:
        _id:         { type: string }
        name:        { type: string }
        description: { type: string }
        isFeatured:  { type: boolean }
        createdAt:   { type: integer }

    AddBotRequest:
      type: object
      required: [name]
      properties:
        name:        { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 500 }
        token:       { type: string }

security:
  - bearerAuth: []
