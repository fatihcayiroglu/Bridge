apply plugin: 'com.android.application'
// [FINAL21 Faz 3] `kotlin-android` KALDIRILDI. Tek Kotlin dosyasi
// (MainActivity.kt) icinde hicbir kod tasimiyordu; buna karsilik
// `npx cap add android` Capacitor 8'de JAVA iskelesi uretir ve Kotlin
// Gradle eklentisinin classpath'ini KOYMAZ. Sonuc: BUILD.md'de belgelenen
// yol 'Plugin with id kotlin-android not found' ile duruyordu. Ayrinti:
// MainActivity.java dosya basligi.
//
// [FINAL21 Faz 19] Bu dosya `mobile/scripts/apply-android-overlay.js` ile
// Capacitor iskelesinin app/build.gradle dosyasinin YERINE gecer; bu yuzden
// iskelenin zorunlu parcalarini tasir: `capacitor.build.gradle` (eklenti
// modulleri — olmadan push/kamera/klavye eklentileri APK'ya GIRMEZ), cordova
// eklenti modulu, web varliklari icin ignoreAssetsPattern ve KOSULLU
// google-services (google-services.json yoksa derleme yine basarili olur;
// kosulsuz uygulama "File google-services.json is missing" ile duruyordu).

android {
  namespace "com.bridge.app"
  compileSdk rootProject.ext.compileSdkVersion
  defaultConfig {
    applicationId "com.bridge.app"
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion
    versionCode 1125000
    versionName "1.125.0"
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    aaptOptions {
      cruncherEnabled false
      // Capacitor iskelesinin degeri: modern web paketindeki `_` ile baslayan
      // dosya/dizinler varsayilan AAPT desenince DUSURULURDU.
      ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
  }
  signingConfigs {
    release {
      storeFile file(System.getenv("BRIDGE_KEYSTORE_PATH") ?: "bridge-release.keystore")
      storePassword System.getenv("BRIDGE_KEYSTORE_PASSWORD") ?: ""
      keyAlias System.getenv("BRIDGE_KEY_ALIAS") ?: "bridge"
      keyPassword System.getenv("BRIDGE_KEY_PASSWORD") ?: ""
    }
  }
  buildTypes {
    release {
      minifyEnabled true
      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
      signingConfig signingConfigs.release
    }
    debug {
      applicationIdSuffix ".debug"
      versionNameSuffix "-debug"
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

repositories {
  flatDir {
    dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
  }
}

dependencies {
  implementation fileTree(include: ['*.jar'], dir: 'libs')
  implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
  implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
  implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
  implementation project(':capacitor-android')
  testImplementation "junit:junit:$junitVersion"
  androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
  androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
  implementation project(':capacitor-cordova-android-plugins')
  // [FINAL21 Faz 19] Ayri `firebase-bom:33.0.0` + `firebase-messaging-ktx` sabitlemesi KALDIRILDI:
  // @capacitor/push-notifications `firebase-messaging`i (25.0.1) kendisi getirir; manifestteki
  // FirebaseMessagingService oradan gelir ve uygulama kodu Firebase API'si KULLANMAZ. Sabitleme
  // eklentininkinden ESKI bir KTX hattini yanina ekliyordu ve hic derlenmemisti (Faz 3 APK'si onsuzdu).
}

apply from: 'capacitor.build.gradle'

try {
  def servicesJSON = file('google-services.json')
  if (servicesJSON.text) {
    apply plugin: 'com.google.gms.google-services'
  }
} catch(Exception e) {
  logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
