<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bridge Marketplace</title>
  <!-- ── TEMA ÖNYÜKLEMESİ ─────────────────────────────────────────────────
       ÖLÇÜLEN KUSUR (Final20): bu sayfada tema önyüklemesi YOKTU. `data-theme`
       hiç yazılmadığı için sayfa, kullanıcının seçimi ne olursa olsun `:root`
       (koyu) tokenlarıyla çiziliyordu. `index.html` ile birebir aynı blok. ── -->
<script>
(function () {
  var THEMES = ['dark', 'light', 'amoled', 'aurora', 'midnight'];
  var theme = null;
  try {
    var saved = localStorage.getItem('bridge:theme:v1') || localStorage.getItem('bridge_theme');
    if (THEMES.indexOf(saved) !== -1) theme = saved;
  } catch (e) { /* depolama kapalı — sistem tercihine düşülür */ }
  if (!theme) {
    try {
      theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    } catch (e) { theme = 'dark'; }
  }
  var root = document.documentElement;
  root.setAttribute('data-theme', theme);
  root.style.colorScheme = theme === 'light' ? 'light' : 'dark';
  // <body> henüz yok; hazır olur olmaz aynı sözleşme oraya da yazılır.
  document.addEventListener('DOMContentLoaded', function () {
    document.body.setAttribute('data-theme', theme);
    document.body.classList.toggle('theme-light', theme === 'light');
  });
})();
</script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: var(--bg-1); color: var(--text-1); margin: 0; font-family: Inter, system-ui, sans-serif; }
    .page { max-width: 1100px; margin: 0 auto; padding: 24px 18px 40px; }
    .top { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 14px; }
    .title { font-size: 28px; font-weight: 800; }
    .subtitle { color: var(--text-3); font-size: 14px; margin-top: 4px; }
    .filters { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0 20px; }
    .search { min-width: 260px; flex: 1; max-width: 420px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 12px; }
    .card { background: var(--bg-2); border: 1px solid var(--bg-4); border-radius: 12px; padding: 14px; }
    .muted { color: var(--text-3); font-size: 13px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .pill { font-size: 12px; padding: 4px 8px; border-radius: 999px; background: var(--bg-3); color: var(--text-2); border: 1px solid var(--bg-4); }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: none; align-items: center; justify-content: center; z-index: var(--z-modal); }
    .modal-card { width: min(560px, 95vw); max-height: 90vh; overflow: auto; background: var(--bg-1); border: 1px solid var(--bg-4); border-radius: 14px; padding: 16px; }
    .field { width: 100%; margin-top: 8px; }
    /* ÖLÇÜLEN KUSUR (Final20): `.btn` bu sayfada HİÇ tanımlı değildi.
       `<a class="btn">` tarayıcının varsayılan bağlantı rengine düşüyor ve
       koyu zeminde #0000ee / #151720 = 1.9:1 kontrast veriyordu — WCAG 1.4.3
       (AA) 4.5:1 ister; pratikte düğme okunmuyordu. */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 8px 14px; border-radius: 8px; cursor: pointer;
      font-size: 14px; font-weight: 600; line-height: 1.2;
      text-decoration: none;
      background: var(--bg-3); color: var(--text-1);
      border: 1px solid var(--bg-4);
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .btn:hover { background: var(--bg-4); }
    .btn:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="page">
    <div class="top">
      <div>
        <div class="title">Marketplace</div>
        <div class="subtitle">Botlar ve pluginler tek ekranda</div>
      </div>
      <a class="btn" href="/">Uygulamaya Dön</a>
    </div>
    <div class="filters">
      <input id="q" class="input-field search" type="search" aria-label="Bot veya plugin ara" placeholder="Bot / plugin ara">
      <button class="btn btn-primary" type="button" data-bridge-action="loadMarketplace">Yenile</button>
    </div>
    <h3>Pluginler</h3>
    <div id="plugins" class="grid"></div>
    <h3 style="margin-top:18px;">Botlar</h3>
    <div id="bots" class="grid"></div>
  </main>
  <div id="marketplace-modal" class="modal" role="dialog" aria-modal="true" aria-label="Marketplace ayrıntıları" tabindex="-1">
    <div class="modal-card">
      <div id="mkt-modal-content"></div>
      <div class="row" style="justify-content:flex-end">
        <button class="btn" type="button" data-bridge-action="closeMktModal">Kapat</button>
      </div>
    </div>
  </div>
  <script src="js/plugin-marketplace-page.js"></script>
</body>
</html>
