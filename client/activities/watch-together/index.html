<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Together — Bridge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f1117;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #header {
      background: #1a1d27;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      flex-shrink: 0;
    }
    #header h2 { font-size: 15px; font-weight: 600; color: #fff; }
    #participant-count { font-size: 12px; color: #9ba3bc; margin-left: auto; }
    #main { display: flex; flex: 1; overflow: hidden; }
    #video-area { flex: 1; display: flex; flex-direction: column; background: #000; }
    #youtube-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    #youtube-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }
    #placeholder {
      text-align: center;
      padding: 40px;
    }
    #placeholder .icon { font-size: 64px; margin-bottom: 16px; }
    #placeholder h3 { font-size: 20px; margin-bottom: 8px; color: #fff; }
    #placeholder p { font-size: 14px; color: #9ba3bc; margin-bottom: 24px; }
    #url-form {
      display: flex;
      gap: 8px;
      max-width: 500px;
      margin: 0 auto;
    }
    #url-input {
      flex: 1;
      padding: 10px 14px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    #url-input:focus { border-color: #2d9cdb; }
    #url-input::placeholder { color: #6b7280; }
    .btn-primary {
      padding: 10px 20px;
      background: #2d9cdb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-primary:hover { background: #1a6b8a; }
    #controls {
      background: #1a1d27;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-top: 1px solid rgba(255,255,255,.08);
      flex-shrink: 0;
    }
    #controls.hidden { display: none; }
    .ctrl-btn {
      padding: 6px 12px;
      background: rgba(255,255,255,.08);
      border: none;
      border-radius: 6px;
      color: #e0e0e0;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ctrl-btn:hover { background: rgba(255,255,255,.14); }
    #video-title { font-size: 13px; color: #9ba3bc; margin-left: auto; max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #sidebar {
      width: 220px;
      background: #12141c;
      border-left: 1px solid rgba(255,255,255,.06);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #sidebar-header { padding: 12px 14px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: #6b7280; border-bottom: 1px solid rgba(255,255,255,.06); }
    #participant-list { flex: 1; overflow-y: auto; padding: 8px; }
    .participant-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 6px;
    }
    .participant-item:hover { background: rgba(255,255,255,.05); }
    .participant-avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: #2d9cdb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }
    .participant-name { font-size: 13px; color: #c9d1d9; }
    .host-badge { font-size: 10px; background: #f59e0b; color: #000; padding: 1px 5px; border-radius: 4px; font-weight: 700; }
    #sync-toast {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,.85);
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      pointer-events: none;
      opacity: 0;
      transition: opacity .3s;
      white-space: nowrap;
    }
    #sync-toast.visible { opacity: 1; }
  </style>
</head>
<body>
  <div id="header">
    <span style="font-size:20px">📺</span>
    <h2>Watch Together</h2>
    <span id="participant-count">1 katılımcı</span>
  </div>

  <div id="main">
    <div id="video-area">
      <div id="youtube-container">
        <div id="placeholder">
          <div class="icon">🎬</div>
          <h3>YouTube Videosu Yükle</h3>
          <p>Bir YouTube linki girerek birlikte izlemeye başlayın</p>
          <div id="url-form">
            <input id="url-input" type="text" placeholder="https://youtube.com/watch?v=..." autocomplete="off">
            <button class="btn-primary" id="load-btn">Yükle</button>
          </div>
        </div>
        <iframe id="youtube-iframe"
          allow="autoplay; encrypted-media; picture-in-picture"
          allowfullscreen>
        </iframe>
        <div id="sync-toast">⏱ Senkronize edildi</div>
      </div>

      <div id="controls" class="hidden">
        <button class="ctrl-btn" id="play-btn">▶ Oynat</button>
        <button class="ctrl-btn" id="pause-btn">⏸ Duraklat</button>
        <button class="ctrl-btn" id="sync-btn">🔄 Senkronize Et</button>
        <button class="ctrl-btn" id="change-btn">🎬 Video Değiştir</button>
        <span id="video-title"></span>
      </div>
    </div>

    <div id="sidebar">
      <div id="sidebar-header">Katılımcılar</div>
      <div id="participant-list"></div>
    </div>
  </div>

  <script>
    // Parse URL params
    const params = new URLSearchParams(location.search);
    const channelId = params.get('channel') || '';
    const sessionId = params.get('session') || '';

    // State
    let currentVideoId = null;
    let participants = [];
    let isHost = false;
    let ytPlayer = null;
    let syncInterval = null;

    // Extract YouTube video ID
    function extractVideoId(url) {
      const patterns = [
        /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/,
        /youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/,
      ];
      for (const pat of patterns) {
        const m = url.match(pat);
        if (m) return m[1];
      }
      return null;
    }

    // Load YouTube IFrame API
    const ytScript = document.createElement('script');
    ytScript.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(ytScript);

    window.onYouTubeIframeAPIReady = function() {
      // API ready — player created on demand
    };

    function loadVideo(videoId) {
      currentVideoId = videoId;
      const iframe = document.getElementById('youtube-iframe');
      const placeholder = document.getElementById('placeholder');
      const controls = document.getElementById('controls');

      iframe.src = `https://www.youtube.com/embed/${videoId}?enablejsapi=1&autoplay=1&origin=${encodeURIComponent(location.origin)}`;
      iframe.style.display = 'block';
      placeholder.style.display = 'none';
      controls.classList.remove('hidden');

      // Try to get title via oEmbed
      fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`)
        .then(r => r.json())
        .then(d => { document.getElementById('video-title').textContent = d.title || ''; })
        .catch(() => {});

      // Notify parent frame
      parent.postMessage({ type: 'watch-together:video-loaded', videoId, channelId, sessionId }, '*');
    }

    // Load button
    document.getElementById('load-btn').addEventListener('click', () => {
      const url = document.getElementById('url-input').value.trim();
      const vid = extractVideoId(url);
      if (vid) {
        loadVideo(vid);
        parent.postMessage({ type: 'watch-together:load', videoId: vid, channelId, sessionId }, '*');
      } else {
        document.getElementById('url-input').style.borderColor = '#ef4444';
        setTimeout(() => { document.getElementById('url-input').style.borderColor = ''; }, 1500);
      }
    });
    document.getElementById('url-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('load-btn').click();
    });

    // Controls
    document.getElementById('play-btn').addEventListener('click', () => {
      document.getElementById('youtube-iframe').contentWindow.postMessage(
        '{"event":"command","func":"playVideo","args":""}', '*');
      parent.postMessage({ type: 'watch-together:play', channelId, sessionId }, '*');
    });
    document.getElementById('pause-btn').addEventListener('click', () => {
      document.getElementById('youtube-iframe').contentWindow.postMessage(
        '{"event":"command","func":"pauseVideo","args":""}', '*');
      parent.postMessage({ type: 'watch-together:pause', channelId, sessionId }, '*');
    });
    document.getElementById('sync-btn').addEventListener('click', () => {
      parent.postMessage({ type: 'watch-together:sync-request', channelId, sessionId }, '*');
    });
    document.getElementById('change-btn').addEventListener('click', () => {
      const iframe = document.getElementById('youtube-iframe');
      const placeholder = document.getElementById('placeholder');
      const controls = document.getElementById('controls');
      iframe.style.display = 'none';
      iframe.src = '';
      placeholder.style.display = 'block';
      controls.classList.add('hidden');
      currentVideoId = null;
    });

    // Receive messages from parent (other participants)
    window.addEventListener('message', (e) => {
      const d = e.data;
      if (!d || typeof d !== 'object') return;
      switch (d.type) {
        case 'watch-together:load':
          if (d.videoId && d.videoId !== currentVideoId) loadVideo(d.videoId);
          break;
        case 'watch-together:play':
          document.getElementById('youtube-iframe').contentWindow?.postMessage(
            '{"event":"command","func":"playVideo","args":""}', '*');
          break;
        case 'watch-together:pause':
          document.getElementById('youtube-iframe').contentWindow?.postMessage(
            '{"event":"command","func":"pauseVideo","args":""}', '*');
          break;
        case 'watch-together:participants':
          participants = d.participants || [];
          renderParticipants();
          document.getElementById('participant-count').textContent = `${participants.length} katılımcı`;
          break;
        case 'watch-together:synced':
          showSyncToast();
          break;
      }
    });

    function renderParticipants() {
      const list = document.getElementById('participant-list');
      list.innerHTML = participants.map((p, i) => `
        <div class="participant-item">
          <div class="participant-avatar" style="background:${p.color || '#2d9cdb'}">${(p.name || '?')[0].toUpperCase()}</div>
          <span class="participant-name">${escHtml(p.name || 'Kullanıcı')}</span>
          ${i === 0 ? '<span class="host-badge">HOST</span>' : ''}
        </div>
      `).join('');
    }

    function showSyncToast() {
      const t = document.getElementById('sync-toast');
      t.classList.add('visible');
      setTimeout(() => t.classList.remove('visible'), 2000);
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // Announce ready to parent
    parent.postMessage({ type: 'watch-together:ready', channelId, sessionId }, '*');
  </script>
</body>
</html>
