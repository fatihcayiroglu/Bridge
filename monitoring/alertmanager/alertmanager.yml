global:
  resolve_timeout: 5m
  # Slack webhook — .env'deki ALERTMANAGER_SLACK_WEBHOOK ile override edin
  slack_api_url: 'https://hooks.slack.com/services/BURAYA_WEBHOOK_URL'

# ── Yönlendirme ağacı ─────────────────────────────────────────
route:
  group_by: ['alertname', 'severity']
  group_wait: 30s         # ilk uyarıyı göndermeden önce bekle (gruplama için)
  group_interval: 5m      # aynı gruptaki yeni uyarı için bekleme
  repeat_interval: 4h     # çözülmemiş uyarıyı tekrar gönder
  receiver: 'bridge-warnings'

  routes:
    # Kritik uyarılar → anında bildirim, 1 saatte bir tekrar
    - match:
        severity: critical
      receiver: 'bridge-critical'
      repeat_interval: 1h
      continue: false

    # Rate limit anomalileri → ayrı kanal
    - match_re:
        alertname: 'RateLimit.*|LoginBruteForce'
      receiver: 'bridge-security'
      repeat_interval: 30m
      continue: false

# ── Alıcılar ──────────────────────────────────────────────────
receivers:
  - name: 'bridge-warnings'
    slack_configs:
      - channel: '#bridge-alerts'
        send_resolved: true
        title: '⚠️ Bridge Uyarı: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          Başlangıç: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          {{ end }}
        color: 'warning'

  - name: 'bridge-critical'
    slack_configs:
      - channel: '#bridge-critical'
        send_resolved: true
        title: '🚨 KRİTİK: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          Başlangıç: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          {{ end }}
        color: 'danger'
    # Opsiyonel: e-posta bildirimi
    # email_configs:
    #   - to: 'ops@example.com'
    #     from: 'alertmanager@example.com'
    #     smarthost: 'smtp.example.com:587'
    #     auth_username: 'alertmanager@example.com'
    #     auth_password: 'SMTP_SIFRE'

  - name: 'bridge-security'
    slack_configs:
      - channel: '#bridge-security'
        send_resolved: true
        title: '🔐 Güvenlik Uyarısı: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          Başlangıç: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          {{ end }}
        color: 'danger'

# ── Susturmalar (mute_time_intervals) ─────────────────────────
# Bakım penceresi sırasında uyarıları sustur
# Kullanım: alertmanager API üzerinden dinamik olarak da eklenebilir
inhibit_rules:
  # Sunucu tamamen çevrimdışıysa diğer uyarıları sustur
  - source_match:
      alertname: 'BridgeDown'
      severity: 'critical'
    target_match_re:
      alertname: '.*'
    equal: ['job']
