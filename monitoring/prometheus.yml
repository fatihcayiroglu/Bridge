global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'bridge-v61'

# ── Alert kurallarını yükle ────────────────────────────────────
rule_files:
  - '/etc/prometheus/rules/*.yml'

# ── Alertmanager bağlantısı ───────────────────────────────────
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
      timeout: 10s

# ── Scrape hedefleri ──────────────────────────────────────────
scrape_configs:
  # Bridge sunucusu
  - job_name: bridge
    scrape_interval: 15s
    static_configs:
      - targets: ['host.docker.internal:3000']   # host makinedeki Bridge
    metrics_path: /metrics
    authorization:
      type: Bearer
      # .env dosyasındaki METRICS_SECRET değerinizle değiştirin
      credentials: METRICS_SECRET_BURAYA

  # Prometheus'un kendisi
  - job_name: prometheus
    scrape_interval: 30s
    static_configs:
      - targets: ['localhost:9090']

  # Alertmanager metrikleri
  - job_name: alertmanager
    scrape_interval: 30s
    static_configs:
      - targets: ['alertmanager:9093']
