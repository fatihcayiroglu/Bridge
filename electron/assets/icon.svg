<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Bridge desktop mark: the web manifest's brand gradient (#3b8fef -> #f5a623)
       with a vector suspension-bridge glyph instead of an emoji, so it renders
       identically at every icon size and on every platform. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b8fef"/>
      <stop offset="1" stop-color="#f5a623"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bg)"/>
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M34 164 L80 72 Q128 190 176 72 L222 164" stroke-width="11"/>
    <path d="M80 64 V196 M176 64 V196" stroke-width="17"/>
    <path d="M28 168 H228" stroke-width="16"/>
    <path d="M106 136 V168 M128 146 V168 M150 136 V168" stroke-width="7"/>
  </g>
</svg>
