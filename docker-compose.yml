# ══════════════════════════════════════════════════════════════
# Bridge — Tam Stack
# Kullanım: docker compose up -d
# ══════════════════════════════════════════════════════════════

services:

  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:18-alpine
    container_name: bridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       bridge
      POSTGRES_USER:     bridge
      # POSTGRES_PASSWORD zorunlu — .env dosyasına ekle.
      # Örnek: openssl rand -hex 32
      # ⚠️  Varsayılan değer YOKTUR — eksikse compose başlamaz.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD zorunlu - .env dosyasina ekle: openssl rand -hex 32}"
    volumes:
      # Final21 Faz 19: postgres:18 imajı veriyi /var/lib/postgresql/18/docker altında tutar (PGDATA) ve
      # bir birim /var/lib/postgresql/data'ya bağlıyken BAŞLAMAYI REDDEDER ("in 18+, these Docker images
      # are configured to store database data in a format which is compatible with pg_ctlcluster").
      # Eski bağlama noktasıyla PostgreSQL hiç açılmıyor, Bridge ona bağımlı olduğu için yığın ayağa
      # kalkmıyordu (ölçüldü: tools/p19-compose-prod-boot.sh). Birim, imajın önerdiği kök dizine bağlanır.
      - postgres_data:/var/lib/postgresql
    # Fix 4: 5432 expose edilmiyor — container-internal erişim yeterli
    # Lokal geliştirme için: ports: ["5432:5432"] ekle (production'da asla)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bridge -d bridge"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:8-alpine
    container_name: bridge-redis
    restart: unless-stopped
    # Final21 Faz 10 — F21-10-03: maxmemory-policy MUTLAKA noeviction.
    # Redis hiz siniri / CSRF / WS baglanti limiti icin YETKILI depodur.
    # allkeys-lru ile OLCULDU (redis:8-alpine, maxmemory 4mb): arama siniri
    # doldu (429), bellek baskisi 31 807 anahtar tahliye etti, iki hiz siniri
    # anahtari da silindi ve AYNI DAKIKADA 5/5 arama 200 dondu — sinir ASILDI.
    # noeviction ile ayni adimlar: yazmalar reddedildi, anahtarlar kaldi, 5/5 429.
    # Bellek dolarsa Bridge fail-closed 503 verir (docs/REDIS_PRODUCTION.md).
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    # Fix 4: 6379 expose edilmiyor — container-internal erişim yeterli
    # Lokal geliştirme için: ports: ["6379:6379"] ekle (production'da asla)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Bridge Server ───────────────────────────────────────────
  bridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bridge-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV:       production
      PORT:           3001
      # P5 SH-01: the versioned migration chain runs at boot (advisory lock;
      # readiness stays 503 while anything is pending). Set to false only if
      # migrations are run separately: `node server/dist/db/migrate-postgres.js up`.
      BRIDGE_AUTO_MIGRATE: "${BRIDGE_AUTO_MIGRATE:-true}"

      # Veritabanı
      DATABASE_URL: "postgresql://bridge:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD zorunlu}@postgres:5432/bridge"
      DATABASE_SSL:   "false"

      # Redis
      REDIS_URL:      redis://redis:6379

      # JWT — production'da mutlaka değiştir!
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET zorunlu - .env dosyasına ekle}"
      REFRESH_SECRET: "${REFRESH_SECRET:?REFRESH_SECRET zorunlu - .env dosyasına ekle}"
      FEDERATION_SECRET: "${FEDERATION_SECRET:?FEDERATION_SECRET zorunlu - en az 32 karakter}"
      AP_ENCRYPTION_KEY: "${AP_ENCRYPTION_KEY:?AP_ENCRYPTION_KEY zorunlu - 64 hex karakter}"
      METRICS_SECRET: "${METRICS_SECRET:?METRICS_SECRET zorunlu - en az 16 karakter}"

      # Direct 3001 exposure is the default, so forwarded headers are not
      # trusted unless an operator explicitly enables the nginx profile and
      # sets TRUSTED_PROXY_COUNT=1.
      TRUSTED_PROXY_COUNT: "${TRUSTED_PROXY_COUNT:-0}"

      # Must match the named-volume mount below and the image's runtime path.
      BRIDGE_UPLOAD_ROOT: /app/server/uploads

      # CORS
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:3001}"

      # Public identity (P5 FED-07). Federation actor/key ids and passkeys are
      # bound to it. The default equals the server's own fallback; a real
      # deployment sets INSTANCE_URL=https://chat.example.com and
      # WEBAUTHN_RP_ID=chat.example.com in .env. Production refuses to boot on
      # a non-https (non-loopback) INSTANCE_URL, or one with a path/credentials.
      INSTANCE_URL: "${INSTANCE_URL:-http://localhost:3001}"
      WEBAUTHN_RP_ID: "${WEBAUTHN_RP_ID:-}"

      # AI (opsiyonel). Nothing is required: with no provider set, AI features
      # fall back to local rules. Self-hosted options (no third-party service):
      #   OLLAMA_URL=http://ollama:11434  or
      #   AI_PROVIDER=openai-compatible AI_BASE_URL=http://llm:8000/v1 AI_MODEL=<model>
      # (vLLM, llama.cpp server, LM Studio, LocalAI). AI_PROVIDER=none turns AI
      # off even when keys are set. See docs/AI.md.
      AI_PROVIDER: "${AI_PROVIDER:-}"
      AI_BASE_URL: "${AI_BASE_URL:-}"
      AI_MODEL: "${AI_MODEL:-}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_TIMEOUT_MS: "${AI_TIMEOUT_MS:-30000}"
      OLLAMA_URL: "${OLLAMA_URL:-}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3.2}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"

      # Email (opsiyonel)
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      FROM_EMAIL: "${FROM_EMAIL:-noreply@bridge.local}"

      # Push bildirimleri (opsiyonel)
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"

      # ── Mediasoup SFU (group voice) ──────────────────────────
      # MEDIASOUP_ANNOUNCED_IP: sunucunun dışarıdan erişilebilir public IP'si
      # Boş bırakılırsa SFU başlamaz, P2P fallback devreye girer.
      # Örnek: MEDIASOUP_ANNOUNCED_IP=1.2.3.4
      MEDIASOUP_ANNOUNCED_IP: "${MEDIASOUP_ANNOUNCED_IP:-}"
      MEDIASOUP_RTC_MIN_PORT: "${MEDIASOUP_RTC_MIN_PORT:-40000}"
      MEDIASOUP_RTC_MAX_PORT: "${MEDIASOUP_RTC_MAX_PORT:-49999}"
      MEDIASOUP_WORKERS: "${MEDIASOUP_WORKERS:-1}"
      MEDIASOUP_OPUS_BITRATE: "${MEDIASOUP_OPUS_BITRATE:-64}"
      MEDIASOUP_VIDEO_MAX_BITRATE: "${MEDIASOUP_VIDEO_MAX_BITRATE:-3000}"
      REQUIRE_TURN: "${REQUIRE_TURN:-false}"
      REQUIRE_SFU: "${REQUIRE_SFU:-false}"

      # ── WebP Otomatik Dönüşüm (sharp) ────────────────────────
      # JPEG/PNG/TIFF/BMP yüklemelerini otomatik WebP'ye çevirir.
      # sharp paketinin kurulu olması gerekir: npm install sharp
      # GIF ve SVG dönüştürülmez (animasyon/vektör korunur).
      WEBP_CONVERT: "${WEBP_CONVERT:-false}"
      WEBP_QUALITY: "${WEBP_QUALITY:-82}"

      # ── CDN / Medya Depolama ──────────────────────────────────
      # CDN_PROVIDER=local    → uploads/ klasörü (varsayılan)
      # CDN_PROVIDER=minio    → self-hosted MinIO (geliştirme/küçük prod)
      # CDN_PROVIDER=r2       → Cloudflare R2
      # CDN_PROVIDER=b2       → Backblaze B2
      CDN_PROVIDER: "${CDN_PROVIDER:-local}"

      # -- Protected message/voice attachments --
      # Public avatar/emoji/GIF assets may use CDN_PROVIDER, but protected
      # attachments must use an independent non-public bucket/provider.
      PRIVATE_STORAGE_PROVIDER: "${PRIVATE_STORAGE_PROVIDER:-local}"
      PRIVATE_S3_BUCKET: "${PRIVATE_S3_BUCKET:-}"
      PRIVATE_R2_BUCKET: "${PRIVATE_R2_BUCKET:-}"
      PRIVATE_MINIO_BUCKET: "${PRIVATE_MINIO_BUCKET:-}"
      PRIVATE_B2_BUCKET_NAME: "${PRIVATE_B2_BUCKET_NAME:-}"

      # -- AWS S3 public CDN (CDN_PROVIDER=s3) --
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-}"
      S3_BUCKET: "${S3_BUCKET:-}"
      S3_PUBLIC_URL: "${S3_PUBLIC_URL:-}"

      # -- MinIO (CDN_PROVIDER=minio) --
      # docker-compose ile entegre MinIO için varsayılanlar çalışır.
      # Dış erişim için MINIO_PUBLIC_URL'yi güncelleyin.
      MINIO_ENDPOINT: "${MINIO_ENDPOINT:-http://minio:9000}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minioadmin}"
      MINIO_BUCKET: "${MINIO_BUCKET:-bridge-uploads}"
      MINIO_PUBLIC_URL: "${MINIO_PUBLIC_URL:-http://localhost:9000/bridge-uploads}"

      # -- Cloudflare R2 (CDN_PROVIDER=r2) --
      R2_ACCOUNT_ID: "${R2_ACCOUNT_ID:-}"
      R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID:-}"
      R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY:-}"
      R2_BUCKET: "${R2_BUCKET:-}"
      R2_PUBLIC_URL: "${R2_PUBLIC_URL:-}"

      # -- Backblaze B2 (CDN_PROVIDER=b2) --
      B2_KEY_ID: "${B2_KEY_ID:-}"
      B2_APP_KEY: "${B2_APP_KEY:-}"
      B2_BUCKET_NAME: "${B2_BUCKET_NAME:-}"
      B2_REGION: "${B2_REGION:-us-west-004}"
      B2_PUBLIC_URL: "${B2_PUBLIC_URL:-}"

    volumes:
      - uploads_data:/app/server/uploads
    ports:
      - "3001:3001"
      # ── Mediasoup SFU — group voice için zorunlu ──────────────
      # MEDIASOUP_ANNOUNCED_IP set edilmişse UDP portları da aç.
      # Yoksa SFU devre dışı kalır, P2P fallback çalışır.
      - "${MEDIASOUP_RTC_MIN_PORT:-40000}-${MEDIASOUP_RTC_MAX_PORT:-49999}:${MEDIASOUP_RTC_MIN_PORT:-40000}-${MEDIASOUP_RTC_MAX_PORT:-49999}/udp"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Backup Servisi ──────────────────────────────────────────
  # Her gece 02:30'da (TZ=Europe/Istanbul):
  #   1. pg_dump → /backups/postgres/bridge_YYYYMMDD_HHMMSS.sql.gz
  #   2. uploads rsync → /backups/uploads/   (bridge servisindeki volume)
  #   3. BACKUP_KEEP_DAYS günden eski dump'ları sil
  #   4. (Opsiyonel) S3 / MinIO'ya yükle
  #
  # Manuel tetiklemek için:
  #   docker compose exec backup backup.sh
  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    container_name: bridge-backup
    restart: unless-stopped
    # Final21 Faz 19: tini PID 1 olur (sinyal iletimi, çocuk süreç toplama); backup/scheduler.sh.
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Postgres bağlantısı (pg_dump için)
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD zorunlu}"

      # Kaç günlük dump saklanacak (varsayılan: 7)
      BACKUP_KEEP_DAYS: "${BACKUP_KEEP_DAYS:-7}"
      BACKUP_AT: "${BACKUP_AT:-02:30}"
      BACKUP_RUN_ON_START: "${BACKUP_RUN_ON_START:-false}"

      # ── S3 / MinIO (opsiyonel) ──────────────────────────────
      # Doldurursan dump + uploads S3'e de yüklenir.
      # MinIO için: S3_ENDPOINT=http://minio:9000
      # AWS için:   S3_ENDPOINT boş bırak.
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-eu-central-1}"
      S3_BUCKET: "${S3_BUCKET:-}"
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_STORAGE_CLASS: "${S3_STORAGE_CLASS:-STANDARD_IA}"

    volumes:
      # Backup çıktısı — host'ta /var/lib/bridge-backups olarak sakla
      - backup_data:/backups
      # Bridge'in uploads volume'u — salt okunur mount (rsync kaynağı)
      - uploads_data:/app/server/uploads:ro

  # ── Nginx (production reverse proxy) ─────────────────────────
  # nginx.conf dosyası proje kökünde sağlanmaktadır.
  # Aktifleştirmek için: docker compose --profile nginx up
  nginx:
    image: nginx:1.31.2-alpine
    container_name: bridge-nginx
    restart: unless-stopped
    depends_on:
      bridge:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./client:/usr/share/nginx/html:ro
      - certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    profiles:
      - nginx   # varsayılan olarak başlamaz: docker compose --profile nginx up

  # ── Certbot (Let's Encrypt — nginx profiliyle birlikte) ───────
  # İlk sertifika almak için:
  #   docker compose --profile nginx run --rm certbot certonly \
  #     --webroot -w /var/www/certbot \
  #     -d bridge.example.com --email admin@example.com --agree-tos
  # Yenileme (cron / systemd timer ile çalıştırılabilir):
  #   docker compose --profile nginx run --rm certbot renew
  certbot:
    image: certbot/certbot:latest
    container_name: bridge-certbot
    volumes:
      - certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Entrypoint override: manuel çalıştırma için (yukarıdaki komutlar)
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"
    profiles:
      - nginx


  # Self-hosted S3-uyumlu nesne depolama. Geliştirme veya küçük
  # production kurulumları için idealdir.
  # Kullanmak için: CDN_PROVIDER=minio env'ini bridge servisine ekle.
  # MinIO Console: http://localhost:9001  (minioadmin / minioadmin)
  minio:
    image: minio/minio:latest
    container_name: bridge-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY zorunlu - .env dosyasina ekle}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:?MINIO_SECRET_KEY zorunlu - en az 8 karakter}"
    ports:
      - "127.0.0.1:9000:9000"   # S3 API; publish through an authenticated proxy if needed
      - "127.0.0.1:9001:9001"   # MinIO Console is host-local by default
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 3
    profiles:
      - minio   # varsayılan olarak başlamaz: docker compose --profile minio up

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  minio_data:
  # Backup volume'u — named volume yerine host bind-mount tercih edersen:
  # backup_data: {}  → kaldır, bridge servisi altına ekle:
  #   volumes:
  #     - /var/lib/bridge-backups:/backups
  backup_data:
  # Nginx TLS sertifikaları (Let's Encrypt / certbot)
  certs:
  certbot_www:
