# infra/nginx-cloudflare.conf
#
# ============================================================================
# BRIDGE ORIGIN — CLOUDFLARE ARKASINDA
# ============================================================================
# Bu dosya `nginx-site.conf`un YERINE gecer (ikisini birden etkinlestirmeyin).
# Cloudflare EDGE ile Bridge arasindaki origin katmanini tanimlar.
#
#   CLIENT --HTTPS--> CLOUDFLARE --HTTPS--> BU NGINX --HTTP--> BRIDGE
#
# ── OPERATORUN DEGISTIRMESI GEREKENLER ──────────────────────────────────────
#   bridge.example.com          → gercek alan adiniz
#   /etc/ssl/bridge/*           → gercek sertifika yollari
#   /path/to/bridge/*           → gercek kurulum dizini
#
# ── NEDEN TLS ORIGIN'DE DE GEREKLI ──────────────────────────────────────────
# Cloudflare SSL/TLS modu **Full (strict)** olmalidir. Bu, Cloudflare'in
# origin'e HTTPS ile baglanmasini ve sertifikayi DOGRULAMASINI gerektirir.
# "Flexible" modu KULLANMAYIN: edge ile origin arasi duz HTTP olur ve
# kullaniciya kilit ikonu gosterilirken trafik aslinda sifresizdir.
#
# Sertifika iki sekilde saglanabilir:
#   A) Genel CA (Let's Encrypt) — tarayici da dogrudan guvenir
#   B) Cloudflare Origin CA     — YALNIZCA Cloudflare<->origin icindir;
#                                  tarayici bu sertifikaya guvenmez ve
#                                  guvenmesi de BEKLENMEZ

# ── GERCEK ISTEMCI IP'SI ────────────────────────────────────────────────────
# Cloudflare, gercek istemciyi `CF-Connecting-IP` olarak ve ayrica
# `X-Forwarded-For` zincirine EKLEYEREK iletir.
#
# Bridge kimligi KANONIK olarak XFF zincirinden turetir (lib/clientIp.ts) ve
# sondan `TRUSTED_PROXY_COUNT` kadar geriye bakar. Bu kurulumda zincir:
#
#     <gercek istemci>, <cloudflare POP>        (nginx kendi hop'unu ekler)
#
# oldugundan **TRUSTED_PROXY_COUNT=2** olmalidir.
#
#   !! KRITIK: 1 yazarsaniz Bridge Cloudflare POP adresini istemci sanar ve
#      TUM kullanicilar tek kimlige coker — hiz siniri, IP yasagi ve
#      paylasilan-IP adaleti anlamsizlasir. Bu davranis testle belgelenmistir:
#      server/tests/cloudflare-client-ip.test.ts
#
# Asagidaki `set_real_ip_from` bloklari nginx'in $remote_addr degerini de
# gercek istemciye cevirir (loglar icin faydali). Bridge'in kimlik karari
# yine de XFF + TRUSTED_PROXY_COUNT uzerinden yurur.
#
# Guncel listeler: https://www.cloudflare.com/ips/
# Bu listeler DEGISIR; periyodik guncelleyin (asagidaki cron notuna bakin).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

include /path/to/bridge/infra/nginx-upstream.conf;

# ── HTTP → HTTPS ────────────────────────────────────────────────────────────
# Cloudflare "Always Use HTTPS" ile zaten yonlendirir; bu blok, edge
# atlanirsa (dogrudan origin erisimi) ikinci bir savunmadir.
server {
    listen 80;
    listen [::]:80;
    server_name bridge.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bridge.example.com;

    # A) Let's Encrypt   veya   B) Cloudflare Origin CA
    ssl_certificate     /etc/ssl/bridge/fullchain.pem;
    ssl_certificate_key /etc/ssl/bridge/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # ── AUTHENTICATED ORIGIN PULLS (onerilir) ───────────────────────────────
    # Cloudflare'in origin'e istemci sertifikasi sunmasini ZORUNLU kilar;
    # boylece edge'i atlayan dogrudan istekler TLS katmaninda reddedilir.
    # Cloudflare'in origin-pull CA sertifikasini indirip yolu yazin, sonra
    # asagidaki iki satiri acin:
    #   ssl_client_certificate /etc/ssl/cloudflare/origin-pull-ca.pem;
    #   ssl_verify_client on;

    # Yukleme boyutu Bridge'in kendi sinirlariyla uyumlu olmalidir
    # (MAX_FILE_SIZE_MB). Buradaki deger URUN sinirindan KUCUK olmamalidir,
    # aksi halde nginx, Bridge'in kabul edecegi bir yuklemeyi 413 ile keser.
    client_max_body_size 100m;

    # ── HSTS ────────────────────────────────────────────────────────────────
    # BILINCLI OLARAK KAPALI. Once TUM production hostname'lerinin HTTPS
    # uzerinden dogru calistigi DOGRULANMALIDIR; erken acilan HSTS, hatali
    # bir alt alan adini tarayici tarafinda uzun sure erisilemez kilar.
    # Dogrulamadan SONRA acin (ve `preload`u ancak tam eminken ekleyin):
    #   add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;

    # ── UYGULAMA + WEBSOCKET ────────────────────────────────────────────────
    location / {
        proxy_pass         http://bridge_backend;
        proxy_http_version 1.1;

        # Socket.IO WebSocket yukseltmesi bunlar olmadan CALISMAZ.
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Cloudflare metadata — TANI icin faydali, YETKI icin DEGIL.
        proxy_set_header   CF-Ray            $http_cf_ray;
        proxy_set_header   CF-IPCountry      $http_cf_ipcountry;

        # Uzun omurlu soketler: Bridge realtime baglantilari saatlerce acik
        # kalir. Kisa bir read timeout, sessiz kopmalara yol acar.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Realtime icin tamponlama KAPALI: aksi halde olaylar toplu iletilir
        # ve yaziyor/mesaj bildirimleri gecikir.
        proxy_buffering off;
    }

    # ── SAGLIK ──────────────────────────────────────────────────────────────
    # ASLA onbeleklenmez: Bridge burada CANLI bagimlilik durumunu bildirir
    # (Redis/PostgreSQL erisilemezken 503). Onbeleklenmis bir 200, olay
    # aninda operatoru yanlis yonlendirir.
    location = /api/health {
        proxy_pass            http://bridge_backend;
        proxy_set_header      Host $host;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout    3s;
        add_header Cache-Control "no-store" always;
        access_log off;
    }

    # ── METRIKLER ───────────────────────────────────────────────────────────
    # `/metrics` INTERNETE ACILMAZ. Bridge ayrica METRICS_SECRET ile korur,
    # ama savunma tek katmana birakilmaz: origin'de de kapatilir.
    # Prometheus'u ozel ag/VPN uzerinden veya bu allowlist ile scrape edin.
    location = /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;
        proxy_pass       http://bridge_backend;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    # ── UPLOAD BAYTLARI ─────────────────────────────────────────────────────
    # Mesaj/DM/GDM ekleri Node'daki uploadAuthz ile her istekte yeniden
    # yetkilendirilir. Origin'in dosyayı alias ile doğrudan sunması bu gizlilik
    # sınırını atlar ve Cloudflare'in private baytı public cache'e koymasına da
    # yol açabilir.
    location ^~ /uploads/ {
        proxy_pass            http://bridge_backend;
        proxy_http_version    1.1;
        proxy_set_header      Host $host;
        proxy_set_header      X-Real-IP $remote_addr;
        proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_buffering       off;
    }
}

# ── CLOUDFLARE IP LISTESI GUNCELLEME ────────────────────────────────────────
# Yukaridaki araliklar zamanla degisir. Ornek gunluk yenileme:
#
#   0 4 * * * curl -s https://www.cloudflare.com/ips-v4 \
#     | sed 's|^|set_real_ip_from |; s|$|;|' > /etc/nginx/cf-ips.conf && \
#     curl -s https://www.cloudflare.com/ips-v6 \
#     | sed 's|^|set_real_ip_from |; s|$|;|' >> /etc/nginx/cf-ips.conf && \
#     nginx -t && systemctl reload nginx
#
# Bu dosyada listeyi satir ici tutmak yerine `include /etc/nginx/cf-ips.conf;`
# kullanmak, guncellemeyi otomatiklestirmenin daha temiz yoludur.
