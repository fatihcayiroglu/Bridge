# /etc/nginx/sites-available/bridge
# Bu dosyayı /etc/nginx/sites-enabled/'a semlink olarak ekleyin.
# nginx-upstream.conf include ile birlikte çalışır.

include /path/to/bridge/infra/nginx-upstream.conf;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # HTTPS'e yönlendir (production'da aktif et)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass         http://bridge_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;   # WebSocket uzun bağlantı
        proxy_send_timeout 86400s;
    }

    # Health check endpoint — deploy-canary.sh tarafından kullanılır
    location = /api/health {
        proxy_pass         http://bridge_backend;
        proxy_connect_timeout 3s;
        proxy_read_timeout    3s;
        access_log off;
    }

    # Static dosyalar (varsa)
    location /uploads/ {
        alias /path/to/bridge/server/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
