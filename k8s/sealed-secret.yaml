# k8s/sealed-secret.yaml
# Sprint 85: Sealed Secrets entegrasyonu
#
# ════════════════════════════════════════════════════════════════
# BU DOSYA GIT'E COMMIT EDİLEBİLİR — şifreli içerik güvenlidir.
# Orijinal k8s/secret.yaml artık kullanılmaz; .gitignore'a ekle.
# ════════════════════════════════════════════════════════════════
#
# ── Ön koşullar ──────────────────────────────────────────────
#
# 1. Sealed Secrets controller cluster'da çalışıyor olmalı:
#    kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/latest/download/controller.yaml
#
# 2. kubeseal CLI kurulumu:
#    # macOS
#    brew install kubeseal
#    # Linux
#    wget https://github.com/bitnami-labs/sealed-secrets/releases/latest/download/kubeseal-linux-amd64 \
#      -O /usr/local/bin/kubeseal && chmod +x /usr/local/bin/kubeseal
#
# ── Şifreleme adımları ───────────────────────────────────────
#
# Adım 1: Cluster'ın public sertifikasını çek (tek seferlik):
#   kubeseal --fetch-cert \
#     --controller-name=sealed-secrets \
#     --controller-namespace=kube-system \
#     > k8s/sealed-secrets-pub.pem
#   # pub.pem'i git'e commit edebilirsin (public key, güvenli)
#
# Adım 2: Düz secret'ı oluştur (COMMIT ETME):
#   kubectl create secret generic bridge-secrets \
#     --namespace bridge \
#     --from-literal=JWT_SECRET="$(node -e "console.log(require('crypto').randomBytes(64).toString('hex'))")" \
#     --from-literal=REFRESH_SECRET="$(node -e "console.log(require('crypto').randomBytes(64).toString('hex'))")" \
#     --from-literal=DATABASE_URL="postgresql://bridge:SIFRE@postgres-svc:5432/bridge" \
#     --from-literal=REDIS_URL="redis://redis-svc:6379" \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 32)" \
#     --dry-run=client -o yaml > /tmp/bridge-secret-plain.yaml
#
# Adım 3: Şifrele → bu dosyayı güncelle:
#   kubeseal --cert k8s/sealed-secrets-pub.pem \
#     --format yaml \
#     < /tmp/bridge-secret-plain.yaml \
#     > k8s/sealed-secret.yaml
#   rm /tmp/bridge-secret-plain.yaml
#
# Adım 4: Uygula:
#   kubectl apply -f k8s/sealed-secret.yaml
#
# ── Rotasyon ─────────────────────────────────────────────────
# Adım 2-4'ü tekrarla. Controller otomatik olarak yeni Secret'ı oluşturur.
# Eski pod'ları rolling restart ile yenile:
#   kubectl rollout restart deployment/bridge -n bridge
#
# ── NOT: Aşağıdaki encryptedData alanları PLACEHOLDER'dır ────
# Gerçek cluster'dan kubeseal ile üretilmiş değerlerle replace edilmeli.
# CI/CD pipeline'ında bu adım otomatize edilebilir:
#   .github/workflows/ci.yml → "Seal secrets" step (örnek aşağıda)
#
# ── GitHub Actions entegrasyonu ──────────────────────────────
# secrets.JWT_SECRET vb. GitHub Secrets'a ekle, sonra:
#
#   - name: Seal secrets
#     run: |
#       kubeseal --fetch-cert \
#         --controller-name=sealed-secrets \
#         --controller-namespace=kube-system > /tmp/pub.pem
#       kubectl create secret generic bridge-secrets \
#         --namespace bridge \
#         --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
#         --from-literal=REFRESH_SECRET="${{ secrets.REFRESH_SECRET }}" \
#         --from-literal=DATABASE_URL="${{ secrets.DATABASE_URL }}" \
#         --from-literal=REDIS_URL="${{ secrets.REDIS_URL }}" \
#         --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
#         --from-literal=METRICS_SECRET="${{ secrets.METRICS_SECRET }}" \
#         --dry-run=client -o yaml \
#       | kubeseal --cert /tmp/pub.pem --format yaml \
#       > k8s/sealed-secret.yaml
#
# ─────────────────────────────────────────────────────────────

apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: bridge-secrets
  namespace: bridge
  annotations:
    # sealedsecrets.bitnami.com/cluster-wide: "true"
    # Namespace-scoped (varsayılan) daha güvenlidir; cluster-wide yalnızca
    # aynı secret'ı birden fazla namespace'te kullanman gerekiyorsa aktif et.
    sealedsecrets.bitnami.com/managed: "true"
spec:
  encryptedData:
    # !! PLACEHOLDER — kubeseal çıktısıyla replace et !!
    JWT_SECRET:          "REPLACE_WITH_KUBESEAL_OUTPUT"
    REFRESH_SECRET:      "REPLACE_WITH_KUBESEAL_OUTPUT"
    DATABASE_URL:        "REPLACE_WITH_KUBESEAL_OUTPUT"
    REDIS_URL:           "REPLACE_WITH_KUBESEAL_OUTPUT"
    POSTGRES_PASSWORD:   "REPLACE_WITH_KUBESEAL_OUTPUT"
    METRICS_SECRET:      "REPLACE_WITH_KUBESEAL_OUTPUT"  # servicemonitor.yaml bearerTokenSecret
  template:
    metadata:
      name: bridge-secrets
      namespace: bridge
    type: Opaque
