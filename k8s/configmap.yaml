apiVersion: v1
kind: ConfigMap
metadata:
  name: bridge-config
  namespace: bridge
data:
  NODE_ENV: "production"
  PORT: "3001"
  INSTANCE_NAME: "Bridge"
  MAX_FILE_SIZE_MB: "2048"
  TRUSTED_PROXY_COUNT: "1"
  # Public identity (P5 FED-07): must be the https origin the ingress serves
  # (k8s/ingress.yaml host). Federation actor/key ids and passkeys are bound to
  # it; production refuses a non-https value or one with a path/credentials.
  INSTANCE_URL: "https://bridge.senindomain.com"
  WEBAUTHN_RP_ID: "bridge.senindomain.com"
  # Override in Secret: JWT_SECRET, REFRESH_SECRET, DATABASE_URL, REDIS_URL
  #
  # ── Final21 Faz 10 — F21-10-02: PAYLAŞILAN YÜKLEME DEPOSU ZORUNLU ───────────
  # Bu dağıtım 2+ replika + HPA çalıştırır ve `uploads` birimi pod başına
  # `emptyDir`dir. Yükleme deposu varsayılan olarak YEREL DİSKTİR. İki gerçek
  # Bridge örneği önünde ÖLÇÜLDÜ: A'ya yüklenen avatar B'de 404 döndü, B aynı
  # URL'yi kullanıcıya veriyordu; pod yeniden başlayınca dosyalar kaybolur.
  #
  # `BRIDGE_MULTI_NODE: "true"` uygulamaya bu dağıtımın çok düğümlü olduğunu
  # bildirir; düğüme yerel depolamayla açılış FAIL-CLOSED reddedilir (pod açık
  # bir hata mesajıyla başlamaz — sessiz veri kaybı yerine). Uzak depolamayı
  # yapılandırın (kimlik bilgileri Secret'ta):
  #   CDN_PROVIDER: "r2"                 # s3 | r2 | minio | b2
  #   PRIVATE_STORAGE_PROVIDER: "r2"     # AYRICA gerekir; yoksa korumalı ekler yerel kalır
  # Tek replikalı bir kurulumda bu satırı kaldırın.
  BRIDGE_MULTI_NODE: "true"
