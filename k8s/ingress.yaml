# Gereksinim: nginx ingress controller (kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/cloud/deploy.yaml)
# TLS: cert-manager ile Let's Encrypt (https://cert-manager.io/docs/installation/)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bridge-ingress
  namespace: bridge
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # WebSocket desteği (Socket.IO için zorunlu)
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    # TLS — cert-manager kullanıyorsan uncomment et:
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  # tls:
  #   - hosts:
  #       - bridge.senindomain.com
  #     secretName: bridge-tls
  rules:
    - host: bridge.senindomain.com   # Kendi domain'ini yaz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bridge-svc
                port:
                  number: 80
