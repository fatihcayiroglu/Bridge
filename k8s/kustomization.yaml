apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bridge

resources:
  - namespace.yaml
  - configmap.yaml
  - sealed-secret.yaml  # Sprint 85: Sealed Secrets (secret.yaml deprecated)
  - postgres.yaml
  - redis.yaml
  - bridge.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - servicemonitor.yaml  # Sprint 85 fix: Prometheus ServiceMonitor
  - networkpolicy.yaml   # Final21 Faz 19: Redis/PostgreSQL yalnızca Bridge pod'larından

# Final21 Faz 10: `bridge.yaml` `bridge-app:latest` taşır. Değişken etiket,
# hangi sürümün çalıştığını belirsiz kılar ve `IfNotPresent` ile düğümler
# farklı imajlar çalıştırabilir. Sürüm, kök `package.json` ile eşlidir
# (scripts/product-surface-contract.test.js denetler).
images:
  - name: bridge-app
    newTag: "1.125.0"
