# k8s/helm/bridge/values.yaml
# Bridge Helm chart varsayılan değerleri
# Üretim ortamı için values-production.yaml ile override et.

# ── Replica & Image ───────────────────────────────────────────
replicaCount: 2

image:
  repository: bridge-app
  # Final21 Faz 10: boş bırakılınca şablon `Chart.appVersion`ı kullanır
  # (`deployment.yaml`: `.Values.image.tag | default .Chart.AppVersion`).
  # Eskiden "latest" idi: değişken etiket, hangi sürümün çalıştığını belirsiz
  # kılar, `IfNotPresent` ile düğümler FARKLI imajlar çalıştırabilir ve geri
  # alma tekrarlanabilir değildir.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# ── Service ───────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 80
  targetPort: 3001

# ── Ingress ───────────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "2048m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/upgrade: "websocket"
    nginx.ingress.kubernetes.io/connection-upgrade: "Upgrade"
    # Final21 Faz 10 — F21-10-01: Socket.IO uzun yoklama oturumları çok
    # replikada AYNI pod'a gitmelidir. İki gerçek örnek önünde yapışkan olmayan
    # vekille ÖLÇÜLDÜ: 25 sn'de hiç bağlanamadı (86 x "Session ID unknown").
    # Ayrıntı: k8s/ingress.yaml.
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/affinity-mode: "persistent"
    nginx.ingress.kubernetes.io/session-cookie-name: "bridge_route"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "172800"
    nginx.ingress.kubernetes.io/session-cookie-samesite: "Lax"
    nginx.ingress.kubernetes.io/session-cookie-secure: "true"
  hosts:
    - host: bridge.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: bridge-tls
      hosts:
        - bridge.example.com

# ── Resources ─────────────────────────────────────────────────
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 2Gi

# ── Autoscaling ───────────────────────────────────────────────
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# ── Pod Disruption Budget ─────────────────────────────────────
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# ── Affinity (anti-affinity) ──────────────────────────────────
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - bridge
          topologyKey: kubernetes.io/hostname

# ── Probes ────────────────────────────────────────────────────
# Final21 Faz 22 (19-40): the server listens only after the schema bootstrap (runtime.ts:
# _initSchema → seed → listen); on an EMPTY database that took 20–81 s here. Without a
# startupProbe the liveness probe below restarts the pod after ~60 s on a first install.
# The startup budget (30 × 10 s = 300 s) only defers liveness until the first success.
startupProbe:
  httpGet:
    path: /api/health/live
    port: 3001
  periodSeconds: 10
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /api/health/live
    port: 3001
  initialDelaySeconds: 30
  periodSeconds: 15
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/health/ready
    port: 3001
  initialDelaySeconds: 10
  periodSeconds: 5
  failureThreshold: 3

# ── Environment ───────────────────────────────────────────────
env:
  PORT: "3001"
  NODE_ENV: production
  INSTANCE_NAME: Bridge
  MAX_FILE_SIZE_MB: "100"
  BRIDGE_E2EE_ENABLED: "true"

# ── Secrets (değerler Sealed Secrets veya external-secrets ile inject edilmeli) ──
secrets:
  # Zorunlu
  JWT_SECRET: ""
  REFRESH_SECRET: ""
  DATABASE_URL: ""
  REDIS_URL: ""
  # Opsiyonel
  SMTP_HOST: ""
  SMTP_USER: ""
  SMTP_PASS: ""
  VAPID_PUBLIC_KEY: ""
  VAPID_PRIVATE_KEY: ""
  GROQ_API_KEY: ""
  SENTRY_DSN: ""

# ── PostgreSQL (bağımlılık — disable edip harici DB de kullanılabilir) ────────
postgresql:
  enabled: true
  auth:
    database: bridge
    username: bridge
    existingSecret: bridge-db-secret
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
  # Final21 Faz 19 — F21-10-04: PostgreSQL'e yalnızca Bridge pod'ları bağlanabilir (Bridge pod'u
  # `bridge.io/postgresql-client: "true"` etiketini taşır). NetworkPolicy uygulayan bir CNI gerekir.
  networkPolicy:
    enabled: true
    ingressRules:
      primaryAccessOnlyFrom:
        enabled: true
        podSelector:
          bridge.io/postgresql-client: "true"
  primary:
    persistence:
      enabled: true
      size: 20Gi
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

# ── Redis (bağımlılık — disable edip harici Redis de kullanılabilir) ──────────
redis:
  enabled: true
  # Final21 Faz 19 — F21-10-04: KİMLİK DOĞRULAMASIZ REDIS YOK. Redis hız sınırı, CSRF, oturum
  # iptali ve soket durumunun yetkili deposudur; parolasız bir Redis ad alanındaki her pod'a
  # bu durumu sıfırlama/yazma imkânı verir. Parola var olan bir Secret'tan okunur:
  #   kubectl create secret generic bridge-redis-secret --from-literal=redis-password="$(openssl rand -hex 32)"
  auth:
    enabled: true
    existingSecret: bridge-redis-secret
    existingSecretPasswordKey: redis-password
  # Yalnızca `<release>-redis-client: "true"` etiketli pod'lar bağlanabilir; Bridge pod'u bu
  # etiketi taşır (templates/deployment.yaml). NetworkPolicy uygulayan bir CNI gerekir.
  networkPolicy:
    enabled: true
    allowExternal: false
  master:
    persistence:
      enabled: true
      size: 5Gi
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

# ── ServiceMonitor (Prometheus Operator) ─────────────────────
serviceMonitor:
  enabled: true
  interval: 30s
  path: /metrics

# ── Pod annotations & labels ─────────────────────────────────
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3001"
  prometheus.io/path: "/metrics"

podLabels: {}

# ── Security context ─────────────────────────────────────────
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# ── Persistent storage (uploads) ─────────────────────────────
persistence:
  enabled: false  # Üretimde CDN (R2/MinIO) önerilir
  storageClass: ""
  size: 10Gi
  accessMode: ReadWriteOnce

# ── Node selector & tolerations ──────────────────────────────
nodeSelector: {}
tolerations: []
