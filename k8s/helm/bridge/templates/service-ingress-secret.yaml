{{/* k8s/helm/bridge/templates/service.yaml */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bridge.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bridge.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "bridge.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP

{{- if .Values.ingress.enabled }}
---
{{/* k8s/helm/bridge/templates/ingress.yaml */}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "bridge.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bridge.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "bridge.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}

---
{{/* k8s/helm/bridge/templates/secret.yaml */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bridge.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bridge.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{- if $value }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}

{{- if .Values.serviceMonitor.enabled }}
---
{{/* k8s/helm/bridge/templates/servicemonitor.yaml */}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "bridge.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bridge.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "bridge.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: {{ .Values.serviceMonitor.path }}
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}

{{- if .Values.persistence.enabled }}
---
{{/* k8s/helm/bridge/templates/pvc.yaml */}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "bridge.fullname" . }}-uploads
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bridge.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
