apiVersion: v1
kind: Service
metadata:
  name: redis-svc
  namespace: bridge
spec:
  selector:
    app: redis
  ports:
    - port: 6379

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          # Final21 Faz 10 — F21-10-03: maxmemory-policy MUTLAKA noeviction.
          # Redis hiz siniri / CSRF / WS baglanti limiti icin YETKILI depodur.
          # allkeys-lru ile OLCULDU (redis:8-alpine, maxmemory 4mb): arama siniri
          # doldu (429), bellek baskisi 31 807 anahtar tahliye etti, iki hiz siniri
          # anahtari da silindi ve AYNI DAKIKADA 5/5 arama 200 dondu — sinir ASILDI.
          # noeviction ile ayni adimlar: yazmalar reddedildi, anahtarlar kaldi, 5/5 429.
          # Bellek dolarsa Bridge fail-closed 503 verir (docs/REDIS_PRODUCTION.md).
          # Final21 Faz 19 — F21-10-04: KİMLİK DOĞRULAMASIZ REDIS YOK.
          # Redis hız sınırı, CSRF, oturum iptali ve soket durumunun YETKİLİ deposudur; ad alanındaki
          # herhangi bir pod parolasız bağlanıp sınırları sıfırlayabilir, iptal edilmiş oturumları
          # geri açabilirdi. Parola `bridge-secrets/REDIS_PASSWORD`tan gelir ve yapılandırma STDIN
          # ile verilir: `--requirepass` argümanı olsaydı pod içinde `ps` ile okunurdu. Ölçüldü
          # (redis:7-alpine, tools/p19-redis-auth-proof.sh): parolasız PING NOAUTH, PID 1 komut
          # satırında parola yok, noeviction korunuyor.
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bridge-secrets
                  key: REDIS_PASSWORD
          command: ["sh", "-c"]
          args:
            - |
              exec redis-server - --maxmemory 256mb --maxmemory-policy noeviction <<EOF
              requirepass $REDIS_PASSWORD
              EOF
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              # Parola argüman değil ortam değişkeniyle verilir (REDISCLI_AUTH).
              command: ["sh", "-c", "REDISCLI_AUTH=\"$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          emptyDir: {}
