# ════════════════════════════════════════════════════════════════
# Bridge — Production Nginx Config
# Sprint 106: docker-compose.yml'de yorum satırında bekleyen nginx
#             servisi için gerçek konfigürasyon.
#
# Kullanım (docker compose):
#   1. docker-compose.yml içinde nginx servisini uncomment et
#   2. Bu dosyayı kullanacak şekilde volumes bölümünü güncelle:
#        volumes:
#          - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
#          - ./client:/usr/share/nginx/html:ro
#          - certs:/etc/letsencrypt:ro
#
# TLS seçenekleri:
#   A) Cloudflare arkasında (önerilen): TLS_MODE=cloudflare → HTTP only (443 Cloudflare'de)
#   B) Let's Encrypt: TLS_MODE=letsencrypt → certbot ile cert al
#   C) Self-signed / iç ağ: TLS_MODE=selfsigned
#
# Özellikler:
#   - HTTP → HTTPS 301 yönlendirmesi
#   - WebSocket / Socket.IO proxy (upgrade header)
#   - Statik dosyalar doğrudan nginx'ten (Bridge JS/CSS/assets)
#   - Gzip sıkıştırma
#   - Security headers (X-Frame-Options, CSP, HSTS)
#   - Rate limiting (login endpoint özel limit)
#   - Büyük dosya upload desteği (client_max_body_size)
# ════════════════════════════════════════════════════════════════

# ── Upstream: Bridge Node.js sunucusu ───────────────────────────
upstream bridge_backend {
    # docker-compose servis adı
    server bridge:3001;

    # Çoklu instance için (horizontal scaling):
    # server bridge_1:3001;
    # server bridge_2:3001;
    # server bridge_3:3001;
    # ip_hash;  # Socket.IO sticky session

    keepalive 32;
}

# ── Rate limit zone'ları ────────────────────────────────────────
# Login endpoint: IP başına 10 istek/dakika
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;
# Genel API: IP başına 300 istek/dakika
limit_req_zone $binary_remote_addr zone=api_zone:20m    rate=300r/m;

# ── HTTP → HTTPS yönlendirme ────────────────────────────────────
server {
    listen 80;
    server_name _;

    # Let's Encrypt ACME challenge (TLS_MODE=letsencrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Diğer tüm HTTP trafiğini HTTPS'e yönlendir
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS (production) ──────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name _;

    # ── TLS Sertifikaları ───────────────────────────────────────
    # Let's Encrypt:
    ssl_certificate     /etc/letsencrypt/live/bridge.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bridge.example.com/privkey.pem;
    # Self-signed / iç ağ:
    # ssl_certificate     /etc/nginx/certs/bridge.crt;
    # ssl_certificate_key /etc/nginx/certs/bridge.key;

    # ── TLS Güvenlik Ayarları ──────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── Güvenlik Başlıkları ────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    # CSP: WebRTC (voice), WebSocket, resim yükleme için izinler
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' wss: https:; worker-src 'self' blob:;" always;

    # ── Genel Ayarlar ──────────────────────────────────────────
    client_max_body_size 2048M;   # MAX_FILE_SIZE_MB ile eşleşmeli
    proxy_read_timeout   600s;    # Büyük dosya upload için
    proxy_send_timeout   600s;

    # ── Güvenlik ────────────────────────────────────────────────
    server_tokens off;  # Nginx versiyon bilgisini gizle

    # ── Gzip Sıkıştırma ────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/x-javascript text/xml
               application/xml application/xml+rss image/svg+xml;

    # ── Statik Dosyalar (Bridge client) ────────────────────────
    root /usr/share/nginx/html;

    # JS/CSS — uzun cache (hash'li dosya adları)
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Görseller / fontlar
    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ── Upload / Medya Dosyaları ────────────────────────────────
    location /uploads/ {
        alias /app/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        # Güvenlik: HTML/JS sunmayı engelle
        add_header Content-Disposition "attachment";
        types { }
        default_type application/octet-stream;
    }

    # ── Rate Limit: Login ───────────────────────────────────────
    location ~* ^/api/v?1?/auth/(login|register) {
        limit_req zone=login_zone burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://bridge_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection      "";
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSocket / Socket.IO ───────────────────────────────────
    location /socket.io/ {
        proxy_pass http://bridge_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket bağlantısını uzun süre açık tut
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # ── API Proxy ───────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_zone burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://bridge_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection      "";
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS preflight için
        proxy_pass_header Access-Control-Allow-Origin;
        proxy_pass_header Access-Control-Allow-Methods;
        proxy_pass_header Access-Control-Allow-Headers;
    }

    # ── SPA Fallback (client-side routing) ─────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
